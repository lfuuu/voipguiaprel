{{- if (eq .Env "dev") }}

image: voip_gui_php_fpm_dev
from: php:7.4-fpm-buster

docker:
  WORKDIR: /root
  USER: root
  EXPOSE: "80"

git:
- add: /install/prepare-scripts
  to: /root/prepare-scripts
  owner: root
  group: root

ansible:
  beforeInstall:
  - name: "set repos"
    shell: |
      echo 'deb [arch=amd64] http://ftp.ru.debian.org/debian/ buster main contrib non-free' > /etc/apt/sources.list
      echo 'deb [arch=amd64] http://ftp.ru.debian.org/debian/ buster-updates main contrib non-free' >> /etc/apt/sources.list
      echo 'deb [arch=amd64] http://security.debian.org/ buster/updates main contrib non-free' >> /etc/apt/sources.list
      echo 'deb [arch=amd64] http://mirror.corbina.net/debian buster main contrib non-free' >> /etc/apt/sources.list
      echo 'deb [arch=amd64] http://mirrors.powernet.com.ru/debian buster main contrib non-free' >> /etc/apt/sources.list
      echo 'deb [arch=amd64] http://mirror.docker.ru/debian buster main contrib non-free' >> /etc/apt/sources.list
      echo 'deb [arch=amd64] http://mirror.hyperdedic.ru/debian buster main contrib non-free' >> /etc/apt/sources.list
      echo 'deb [arch=amd64] http://mirror.mephi.ru/debian buster main contrib non-free' >> /etc/apt/sources.list
      echo 'deb [arch=amd64] http://ftp.psn.ru/debian buster main contrib non-free' >> /etc/apt/sources.list
      echo 'deb [arch=amd64] http://mirror.truenetwork.ru/debian buster main contrib non-free' >> /etc/apt/sources.list
      echo 'deb [arch=amd64] http://repository.su/debian buster main contrib non-free' >> /etc/apt/sources.list
  - name: install packages for fpm
    shell: |
      apt update && apt upgrade -y && apt install -y \
        mc \
        parallel \
        procps \
        iputils-ping \
        vim \
        htop \
        wget \
        git \
        openssh-server \
        postgresql-server-dev-11 \
        postgresql-client \
        zip \
        lame \
        sox
  install:
  - name:  install php-extentions
    shell: |
      cd /tmp/
      curl https://raw.githubusercontent.com/mlocati/docker-php-extension-installer/master/install-php-extensions >> install-php-extensions
      mv install-php-extensions /usr/local/bin/
      chmod uga+x /usr/local/bin/install-php-extensions && sync
      install-php-extensions gd mbstring zip mcrypt curl dom xmlrpc readline json pdo_pgsql amqp igbinary mcrypt msgpack redis ssh2 pdo_pgsql sockets zip opcache xmlwriter bcmath
  - name:  setup composer
    shell: |
        cd && mkdir temp && cd temp \
        && curl -sS https://getcomposer.org/installer -O \
        && php installer --version=1.10.16 \
        && mv composer.phar /usr/local/bin/composer \
        && composer self-update --1 \
        && composer global require "fxp/composer-asset-plugin"
  beforeSetup:
  - name: setup user
    shell: |
      usermod -u 1000 www-data
      groupmod -g 1000 www-data
  - name: install php config
    shell: |
      cp /usr/local/etc/php/php.ini-production /usr/local/etc/php/php.ini
  - name: prepare voip_gui dir
    shell: |
      printf "Host gitlab.mcnloc.ru github.com\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n" >> /etc/ssh/ssh_config


{{- end }}