{{- if not (eq .env "dev") }}
image: {{ .project }}-php-fpm-prod
from: php:7.4-fpm-alpine3.13

docker:
  WORKDIR: /home/www-data
  USER: root
  EXPOSE: "80"
git:
- add: /
  to: /opt/voip_gui
  excludePaths:
  - install
  - werf.yaml
  - werf-partial
  - .editorconfig
  - .gitignore
  owner: www-data
  group: www-data
  stageDependencies:
    install:
      - composer.json
      - composer.lock
    setup:
      - "**/*"
ansible:
  beforeInstall:
  - name: install packages for fpm
    shell: |
      apk add --no-cache mc parallel libc-dev autoconf make gcc g++ bash tar curl procps busybox-extras iputils \
      vim htop wget git openssh postgresql-dev postgresql-client zip \
      lame sox
  - name: setup user
    shell: |
      usermod -u 1000 www-data
      groupmod -g 1000 www-data
  - name:  install php-extentions
    shell: |
      cd /tmp/
      curl https://raw.githubusercontent.com/mlocati/docker-php-extension-installer/master/install-php-extensions >> install-php-extensions
      mv install-php-extensions /usr/local/bin/
      chmod uga+x /usr/local/bin/install-php-extensions && sync
      export HTTP_PROXY=p.kompaas.tech:3128
      export HTTPS_PROXY=p.kompaas.tech:3128
      install-php-extensions gd mbstring zip mcrypt curl dom xmlrpc readline json pdo_pgsql amqp igbinary mcrypt msgpack redis ssh2 pdo_pgsql sockets zip opcache xmlwriter bcmath
      unset HTTP_PROXY
      unset HTTPS_PROXY
  - name: install php config
    shell: |
      cp /usr/local/etc/php/php.ini-production /usr/local/etc/php/php.ini
  - name: Prepare voip_gui dir
    shell: |
      mkdir -p /opt/voip_gui/web
      chown -R www-data. /opt/voip_gui/web
      echo "Сделай:<br>rm -rf /opt/voip_gui; ln -f -s /workspace/voip_gui /opt/voip_gui" > /opt/voip_gui/web/index.html
      printf "Host github.com\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n" >> /etc/ssh/ssh_config
  - name:  Setup composer
    shell: |
        cd && mkdir temp && cd temp \
        && curl -sS https://getcomposer.org/installer -O \
        && php installer --version=1.10.16 \
        && mv composer.phar /usr/local/bin/composer \
        && composer self-update --1 \
        && composer global require "fxp/composer-asset-plugin"
  - name: "Create non-root group for the main application"
    group:
      name: www-data
      state: present
      gid: 1000
  - name: "Create non-root user for the main application"
    user:
      name: www-data
      comment: "Create non-root user for the main application"
      uid: 1000
      group: www-data
      shell: /bin/bash
      home: /home/www-data
  install:
  - name: Composer install
    shell:
      cmd: |    
          cd /opt/voip_gui/ \
          && composer install
  setup:
    - name: 3
      shell: |
        cd /opt/voip_gui/config
        cp log-local.tpl.php log-local.php
        cp params-local.tpl.php params-local.php
        chown -R www-data:www-data /opt/voip_gui/web
        chmod 777 /opt/voip_gui/runtime
        chmod 777 /opt/voip_gui/web/assets
        mkdir /usr/local/etc/php/conf.custom

{{- end }}