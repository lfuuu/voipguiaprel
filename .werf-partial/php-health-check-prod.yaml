image: php-health-check-prod
from: php:7.4-cli
docker:
#  CMD: ["/bin/sleep", "infinity"]
  CMD: ["bash","/app/health/run.sh"]
mount:
- from: tmp_dir
  to: /var/lib/apt/lists
- from: build_dir
  to: /var/cache/apt
git:
- add: /web/health
  to: /app/health
  owner: app
  group: app
  stageDependencies:
    setup:
    - "*"
ansible:
  beforeInstall:
  - name: Disable docker hook for apt-cache deletion
    shell: |
      set -e
      sed -i -e "s/DPkg::Post-Invoke.*//" /etc/apt/apt.conf.d/docker-clean
      sed -i -e "s/APT::Update::Post-Invoke.*//" /etc/apt/apt.conf.d/docker-clean
  - name: "Install additional packages"
    apt:
      state: present
      update_cache: yes
      pkg:
        - locales
        - ca-certificates
        - vim
        - nano
        - telnet
        - mc
  - name: "Generate en_US.UTF-8 default locale"
    locale_gen:
      name: en_US.UTF-8
      state: present
  - name: "Create non-root group for the main application"
    group:
      name: app
      state: present
      gid: 242
  - name: "Create non-root user for the main application"
    user:
      name: app
      comment: "Create non-root user for the main application"
      uid: 242
      group: app
      shell: /bin/bash
      home: /app
  install:
    - name: install
      shell: |
        mkdir -p /app/assets
        chown -R app /app/assets
