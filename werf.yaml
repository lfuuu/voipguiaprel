project: voip-gui
configVersion: 1

---
image: voip-gui-prod
from: centos:7

docker:
  WORKDIR: /opt/voip_gui
  USER: root
  ENV:
    POSTGRES_DB: nispd
    POSTGRES_HOST: localhost
    POSTGRES_USER:
    POSTGRES_PASSWORD:
  # LC_ALL: en_US.UTF-8
  ENTRYPOINT: ["/opt/voip_gui/ENTRYPOINT.sh"]
  #CMD: ["/usr/sbin/httpd" , "-DFOREGROUND"]
  #CMD: ["/bin/sleep","infinity"]
  EXPOSE: "80"

git:
- add: /
  to: /opt/voip_gui
  owner: apache
  group: apache
  stageDependencies:
    install:
      - composer.json
      - composer.lock
    setup:
      - "**/*"
ansible:
  beforeInstall:
    - name: 1
      shell: |
        yum -y update && yum -y install centos-release-scl-rh epel-release 
        yum -y install curl
        rpm -Uvh https://mirror.webtatic.com/yum/el7/webtatic-release.rpm
        yum install -y php56w php56w-cli php56w-curl php56w-gd php56w-json php56w-mcrypt php56w-mysqlnd php56w-pgsql php56w-readline php56w-xdebug php56w-xmlrpc php56w-mbstring php56w-zip php56w-dom
        yum clean all
  install:
    - name: 2
      shell: |
        curl -sS https://getcomposer.org/installer | php
        mv composer.phar /usr/local/bin/composer 
        composer global require "fxp/composer-asset-plugin"
        cd /opt/voip_gui/
        composer install
      args:
        chdir: /opt/voip_gui
  setup:
    - name: 3
      shell: |
        cd /opt/voip_gui/config
        cp db-local.tpl.php db-local.php
        cp log-local.tpl.php log-local.php
        cp params-local.tpl.php params-local.php
        chown -R apache:apache /opt/voip_gui/web
        chmod 777 /opt/voip_gui/runtime
        chmod 777 /opt/voip_gui/web/assets
        cp -pf /etc/httpd/conf/httpd.conf /etc/httpd/conf/httpd.conf.default
        sed -i \
          -e '/^KeepAlive .*$/d' \
          -e '/^Listen 80.*$/d' \
          -e '/^MaxKeepAliveRequests .*$/d' \
          -e '/^KeepAliveTimeout .*$/d' \
          -e '/^ServerSignature On$/d' \
          -e '/^ServerTokens OS$/d' \
          /etc/httpd/conf/httpd.conf \
        && truncate -s 0 \
              /etc/httpd/conf.d/autoindex.conf \
        && chmod 444 \
              /etc/httpd/conf.d/autoindex.conf \
        && truncate -s 0 \
              /etc/httpd/conf.d/welcome.conf \
        && chmod 444 \
              /etc/httpd/conf.d/welcome.conf \
        && { \
          /bin/echo ''; \
          echo '#'; \
          echo '# Custom configuration'; \
          echo '#'; \
          echo 'Listen 8080'; \
          echo 'ServerName voip_gui:8080'; \
          echo 'KeepAlive On'; \
          echo 'MaxKeepAliveRequests 200'; \
          echo 'KeepAliveTimeout 2'; \
          echo 'DocumentRoot "/opt/voip_gui/web"'; \
              echo '<Directory "/opt/voip_gui/web">'; \
          echo '  AllowOverride All'; \
          echo '  Require all granted'; \
          echo ''; \
          echo '</Directory>'; \
        } >> /etc/httpd/conf/httpd.conf \
        && ln -s /opt/voip_gui/web/assets2/healthData.json /opt/voip_gui/web/assets/healthData.json 
      args:
        chdir: /opt/voip_gui

---
image: php-health-check-prod
from: php:7.4-cli
docker:
#  CMD: ["/bin/sleep", "infinity"]
  CMD: ["bash","/app/health/run.sh"]
mount:
- from: tmp_dir
  to: /var/lib/apt/lists
- from: build_dir
  to: /var/cache/apt
git:
- add: /web/health
  to: /app/health
  owner: app
  group: app
  stageDependencies:
    setup:
    - "*"
ansible:
  beforeInstall:
  - name: Disable docker hook for apt-cache deletion
    shell: |
      set -e
      sed -i -e "s/DPkg::Post-Invoke.*//" /etc/apt/apt.conf.d/docker-clean
      sed -i -e "s/APT::Update::Post-Invoke.*//" /etc/apt/apt.conf.d/docker-clean
  - name: "Install additional packages"
    apt:
      state: present
      update_cache: yes
      pkg:
        - locales
        - ca-certificates
  - name: "Generate en_US.UTF-8 default locale"
    locale_gen:
      name: en_US.UTF-8
      state: present
  - name: "Create non-root group for the main application"
    group:
      name: app
      state: present
      gid: 242
  - name: "Create non-root user for the main application"
    user:
      name: app
      comment: "Create non-root user for the main application"
      uid: 242
      group: app
      shell: /bin/bash
      home: /app
  install:
    - name: install
      shell: |
        mkdir -p /app/assets
        chown -R app /app/assets
---
image: voip-gui-dev
from: centos:7
docker:
  WORKDIR: /root
  USER: root
  ENV:
    POSTGRES_DB: nispd
    POSTGRES_HOST: localhost
    POSTGRES_USER:
    POSTGRES_PASSWORD:
  # LC_ALL: en_US.UTF-8
  #ENTRYPOINT: ["/opt/voip_gui/ENTRYPOINT.sh"]
  CMD: ["/usr/sbin/httpd" , "-DFOREGROUND"]
  #CMD: ["/bin/sleep","infinity"]
  EXPOSE: "80"

git:
- add: /install/prepare-scripts
  to: /root/prepare-scripts
  owner: root
  group: root

ansible:
  beforeInstall:
    - name: 1
      shell: |
        yum -y update && yum -y install epel-release yum-utils centos-release-scl
        yum -y install http://opensource.wandisco.com/centos/7/git/x86_64/wandisco-git-release-7-2.noarch.rpm
        rpm -Uvh https://mirror.webtatic.com/yum/el7/webtatic-release.rpm
        yum --enablerepo=centos-sclo-rh -y install rh-postgresql12
        yum install -y php56w php56w-cli php56w-curl php56w-gd php56w-json php56w-mcrypt php56w-mysqlnd php56w-pgsql php56w-readline php56w-xdebug php56w-xmlrpc php56w-mbstring php56w-zip php56w-dom
        yum -y install curl mc git unzip
        yum clean all
  install:
    - name: 2
      shell: |
        echo "source /opt/rh/rh-postgresql12/enable" >> /etc/bashrc
        mkdir -p ~/.ssh
        ln -s /workspace/.ssh/id_rsa ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        mkdir -p /opt/voip_gui/web
        echo "Сделай:<br>rm -rf /opt/voip_gui; ln -s /workspace/voip_gui /opt/voip_gui" > /opt/voip_gui/web/index.html
        printf "Host github.com\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n" >> /etc/ssh/ssh_config
        curl -sS https://getcomposer.org/installer | php
        mv composer.phar /usr/local/bin/composer 
        composer global require "fxp/composer-asset-plugin"
      args:
        chdir: /root
  setup:
    - name: Настройка веб-сервера
      shell: |
        cp -pf /etc/httpd/conf/httpd.conf /etc/httpd/conf/httpd.conf.default
        sed -i \
          -e '/^KeepAlive .*$/d' \
          -e '/^MaxKeepAliveRequests .*$/d' \
          -e '/^KeepAliveTimeout .*$/d' \
          -e '/^ServerSignature On$/d' \
          -e '/^ServerTokens OS$/d' \
          /etc/httpd/conf/httpd.conf \
        && truncate -s 0 \
              /etc/httpd/conf.d/autoindex.conf \
        && chmod 444 \
              /etc/httpd/conf.d/autoindex.conf \
        && truncate -s 0 \
              /etc/httpd/conf.d/welcome.conf \
        && chmod 444 \
              /etc/httpd/conf.d/welcome.conf \
        && { \
          /bin/echo ''; \
          echo '#'; \
          echo '# Custom configuration'; \
          echo '#'; \
          echo 'ServerName voip_gui:80'; \
          echo 'KeepAlive On'; \
          echo 'MaxKeepAliveRequests 200'; \
          echo 'KeepAliveTimeout 2'; \
          echo 'DocumentRoot "/opt/voip_gui/web"'; \
              echo '<Directory "/opt/voip_gui/web">'; \
          echo '  AllowOverride All'; \
          echo '  Require all granted'; \
          echo ''; \
          echo '</Directory>'; \
        } >> /etc/httpd/conf/httpd.conf 
      args:
        chdir: /root
---
image: pgdb-dev
from: postgres:12.3
git:
- add: /install/db/SQL/init.sql
  to: /docker-entrypoint-initdb.d/init.sql
---
image: nginx
from: nginx:stable-alpine
docker:
  EXPOSE: '80'
---
image: testcall-daemon-prod
from: node:12
docker:
  WORKDIR: /app/testdialer
  # Non-root user
  USER: app
  EXPOSE: "3000"
  ENV:
    LC_ALL: en_US.UTF-8
    TERM: xterm
    COLORTERM: truecolor
  #CMD: ["/bin/sleep","infinity"]
  CMD: ["node","testdial.js"]
git:
- add: /daemons/testdialer
  to: /app/testdialer
  owner: app
  group: app
ansible:
  beforeInstall:
  - name: Disable docker hook for apt-cache deletion 
    shell: |
      set -e
      sed -i -e "s/DPkg::Post-Invoke.*//" /etc/apt/apt.conf.d/docker-clean
      sed -i -e "s/APT::Update::Post-Invoke.*//" /etc/apt/apt.conf.d/docker-clean
  - name: "Install additional packages"
    apt:
      state: present
      update_cache: yes
      pkg:
        - locales
        - ca-certificates
  - name: "Generate en_US.UTF-8 default locale"
    locale_gen:
      name: en_US.UTF-8
      state: present
  - name: "Create non-root group for the main application"
    group:
      name: app
      state: present
      gid: 242
  - name: "Create non-root user for the main application"
    user:
      name: app
      comment: "Create non-root user for the main application"
      uid: 242
      group: app
      shell: /bin/bash
      home: /app
  setup:
  - name: "Установка runtime-пакетов"
    shell: |
      npm i --production
    become: yes
    become_user: app
    args:
      chdir: /app/testdialer
