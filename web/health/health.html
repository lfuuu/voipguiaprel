<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <script type="text/javascript">
        (function () {

            'use strict';

            document.addEventListener('DOMContentLoaded', function () {
                var
                    dataUri = '/assets/healthData.json',
                    requestTimeout = 2000,
                    hostnamePort = 8032,
                    request = new XMLHttpRequest(),
                    $result = document.getElementById('monitor'),
                    $lastUpdate = document.getElementById('last-update'),
                    priority = {
                        'STATUS_OK': 0,
                        'STATUS_UNKNOWN': 1,
                        'STATUS_WARNING': 2,
                        'STATUS_CRITICAL': 3,
                        'STATUS_ERROR': 3
                    },
                    getTimeFormat = function(initSeconds) {
                        initSeconds = parseInt(initSeconds, 10)
                        var hours   = Math.floor(initSeconds / 3600),
                            minutes = Math.floor((initSeconds - (hours * 3600)) / 60),
                            seconds = initSeconds - (hours * 3600) - (minutes * 60);

                        if (hours < 10) {
                            hours   = '0' + hours;
                        }
                        if (minutes < 10) {
                            minutes = '0' + minutes;
                        }
                        if (seconds < 10) {
                            seconds = '0' + seconds;
                        }

                        return hours + ' ч. ' + minutes + ' мин. ' + seconds + ' сек.';
                    },
                    setResult = function (data) {
                        try {
                            data = JSON.parse(data);

                            $lastUpdate.innerText = 'Последнее обновление: ' + data['lastUpdate'];

                            for (var index in data) {
                                if (data.hasOwnProperty(index) && index !== 'lastUpdate') {
                                    setBlock(index, data[index]);
                                }
                            }
                            var $error = document.getElementById('error');                  
                            $error.style.visibility = "hidden";  
                        } catch (error) {
                            setError('Ошибка разбора данных' + error);
                        }
                    },
                    setError = function (message) {
                        var $error = document.getElementById('error');
                        if (!$error) {
                            $error = document.createElement('div');
                            $error.id = 'error';
                            $error.className = 'info error';
                            $result.insertBefore($error, $result.firstChild);
                        }
                        $error.innerText = message;

                        $lastUpdate.innerText = 'Когда произошла ошибка: ' + new Date().toLocaleString();
                    },
                    setBlock = function (title, params) {
                        var
                            $header = document.createElement('div'),
                            $headerLink = document.createElement('a'),
                            $footer = document.createElement('div'),
                            $content = document.createElement('div'),
                            maxPriority = 0;

                        for (var index in params) {
                            if (params.hasOwnProperty(index) && typeof params[index] == 'object' && params[index].statusId !== 'STATUS_OK') {
                                var
                                    $info = document.createElement('div'),
                                    $infoMessage  = document.createElement('div');

                                $info.className = 'message';
                                $info.innerText = params[index].itemId;

                                $infoMessage.innerText = params[index].statusMessage;

                                $content.appendChild($info);
                                $content.appendChild($infoMessage);

                                if (priority[params[index].statusId] > maxPriority) {
                                    maxPriority = priority[params[index].statusId];
                                }
                            }
                        }

                        var instanceId = parseInt(params.instanceId, 10);

                        if (!instanceId) {
                            maxPriority = 1;
                            $content.innerText = params;
                            $content.className = 'info error';
                        }

                        $headerLink.setAttribute('target', '_blank');
                        $headerLink.setAttribute('href', 'http://' + title + ':' + hostnamePort);
                        $headerLink.innerText = title + (instanceId ? ' (' + params.instanceId + ')' : '');

                        $header.className = 'header';
                        $header.appendChild($headerLink);

                        $footer.className = 'footer';
                        $footer.innerText = (instanceId ? 'Runtime: ' + getTimeFormat(params.runTime) : '');

                        var $block = document.getElementById(title);
                        if (!$block) {
                            $block = document.createElement('div');
                            $block.className = 'block status-' + maxPriority;
                            $block.id = title;

                            $result.insertBefore($block, $result.firstChild);
                        } else {
                            $block.innerHTML = '';
                            $block.className = 'block status-' + maxPriority;
                        }

                        $block.appendChild($header);
                        $block.appendChild(document.createElement('hr'));
                        $block.appendChild($content);
                        $block.appendChild($footer);
                    };

                request.onreadystatechange = function () {
                    if (request.readyState === 4) {
                        if (request.status === 200) {
                            setResult(request.responseText);
                        } else {
                            setError('Источик данных недоступен: ' + request.status + ' ' + request.statusText);
                        }
                    }
                };

                setInterval(function () {
                    request.open('Get', dataUri + '?rnd=' + Math.random());
                    request.send();
                }, requestTimeout);
            });
        })();
    </script>

        body {
    	    background-color: #e0e0e0;
        }
        a, a:visited {
            color: #000;
            text-decoration: none;
        }

        a:hover {
            color: #0f0f0f;
        }

        .info {
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            clear: both;
        }

        .info.error {
            border: 1px solid #9f2b1e;
            background-color: #d59392;
        }

        .info.text {
            text-align: right;
            color: grey;
        }

        #monitor {
            display: block;
            margin: 0 auto;
            width: 90%;
            font-size: 14px;
        }

        .block {
            width: 19%;
            height: 260px;
            float: left;
            border: 1px solid #AAAAAA;
            padding: 4px;
            box-shadow: 3px 3px 2px rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            margin: 4px;
            box-sizing: border-box;
            position: relative;
            padding-bottom: 25px;
        }

        .block .header {
            font-weight: bold;
            text-align: center;
            padding: 2px;
        }

        .block .footer {
            text-align: right;
            padding: 2px;
            position: absolute;
            left: 0;
            right: 0;
            bottom: 3px;
            border-top: 1px solid #CCC;
        }

        .block .message {
            font-weight: bold;
            margin-top: 8px;
        }
