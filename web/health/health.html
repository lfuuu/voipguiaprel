<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <script type="text/javascript">
        (function () {

            'use strict';

            var health = {
                dataUri: '/assets/healthData.json',
                requestTimeout: 10000,

                extendsInstanceId: 100,

                monitorId: '#monitor',
                lastUpdateId: '#last-update',

                priority: {
                    'STATUS_OK': 0,
                    'STATUS_SYNC': 1,
                    'STATUS_UNKNOWN': 2,
                    'STATUS_WARNING': 3,
                    'STATUS_CRITICAL': 4,
                    'STATUS_ERROR': 4
                },

                request: null,
                $monitor: null,
                $lastUpdate: null,
		
                errors: [],
                warnings: [],
                criticalErrors: [],

                getTimeFormat: function (initSeconds) {
                    initSeconds = parseInt(initSeconds, 10);

                    var hours = Math.floor(initSeconds / 3600),
                            minutes = Math.floor((initSeconds - (hours * 3600)) / 60);

                    if (hours < 10) {
                        hours = '0' + hours;
                    }
                    if (minutes < 10) {
                        minutes = '0' + minutes;
                    }

                    return hours + ' ч. ' + minutes + ' мин. ';
                },

                init: function () {
                    var self = this;

                    this.$monitor = this.get(this.monitorId);
                    this.$lastUpdate = this.get(this.lastUpdateId);

                    this.request = new XMLHttpRequest();
                    this.request.onreadystatechange = function () {
                        var request = self.request;

                        if (request.readyState !== 4) {
                            return false;
                        }

                        if (request.status === 200) {
                            self.setResult(request.responseText);
                        } else {
                            self.setError('Источник данных недоступен: ' + request.status + ' ' + request.statusText);
                        }

                        return true;
                    };
                },

                get: function (selector) {
                    return selector.indexOf('#') === 0 ?
                        document.getElementById(selector.replace(/^#/, '')) :
                        document.querySelector(selector);
                },

                create: function (tagName, properties) {
                    var $element = document.createElement(tagName);

                    for (var property in properties) {
                        if (property === 'text') {
                            $element.textContent = properties[property];
                        } else {
                            $element.setAttribute(property, properties[property]);
                        }
                    }

                    return $element;
                },

                load: function () {
                    if (this.request !== null) {
                        this.request.open('Get', this.dataUri + '?rnd=' + Math.random());
                        this.request.send();
                    }
                },

                setError: function (message) {
                    var $error = this.get('#error');

                    if (!$error) {
                        $error = this.create('div', {
                            id: 'error',
                            class: 'info error'
                        });

                        this.$monitor.insertBefore($error, this.$monitor.firstChild);
                    }

                    $error.innerText = message;
                    $error.style.display = 'block';

                    this.$lastUpdate.innerText = 'Когда произошла ошибка: ' + new Date().toLocaleString();
                },

                unsetError: function () {
                    var $error = this.get('#error');
                    if ($error) {
                        $error.style.display = 'none';
                    }
                },

                setResult: function (json) {
                    this.unsetError();

                    try {
                        json = JSON.parse(json);
                    } catch (error) {
                        this.setError('Ошибка разбора данных: ' + error);
                        return false;
                    }

                    this.$lastUpdate.innerText = 'Последнее обновление: ' + json.lastUpdate;

                    if (json.alert) {
                        this.setError(json.alert);
                        return false;
                    }

                    for (var index in json) {
                        if (json.hasOwnProperty(index) && index !== 'lastUpdate') {
                            this.setBlock(index, json[index]);
                        }
                    }
                },

                setBlock: function (title, params) {
                    var
                        $block = this.get('#' + title),
                        $header = this.create('div', {class: 'header'}),
                        $headerInfo = this.create('div', {class: 'header info'}),
                        $footerInfo = this.create('div', {class: 'footer info'}),
                        $content = this.create('div', {class: 'content'}),
                        maxPriority = 0,
                        instanceId = parseInt(params.instanceId, 10);

                    for (var index in params) {
                        if (
                                params.hasOwnProperty(index)
                                && index.indexOf('item') === 0
                                && typeof params[index] == 'object'
                                && params[index].statusId !== 'STATUS_OK'
                        ) {
                            $content.appendChild(
                                this.create('div', {
                                    class: 'message',
                                    text: params[index].itemId
                                })
                            );
                            $content.appendChild(
                                this.create('div', {
                                    text: params[index].statusMessage,
                                    title: params[index].statusMessage
                                })
                            );

                            if (this.priority[params[index].statusId] > maxPriority) {
                                maxPriority = this.priority[params[index].statusId];
                            }
                        }
                    }

                    if (!instanceId || params instanceof String) {
                        maxPriority = 2;
                        $content.textContent = params;
                        $content.className = 'info error';
                    }

                    if (!$block) {
                        $block = this.create('div', {
                            id: title,
                            class: 'block status-' + maxPriority
                        });
                        this.$monitor.insertBefore($block, this.$monitor.firstChild);
                    } else {
                        $block.innerHTML = '';
                        $block.className = 'block status-' + maxPriority;
                    }

                    $block.appendChild($header);
                    $block.appendChild($headerInfo);
                    $block.appendChild($content);
                    $block.appendChild($footerInfo);

                    $header.appendChild(
                        this.create('a', {
                            target: '_blank',
                            href: params.resourceUrl,
                            text: title + (instanceId ? ' (' + params.instanceId + ')' : '')
                        })
                    );

                    if ($content.className == 'info error') {
			health.criticalErrors.push($block);
                        return false;
                    }

                    // Choose render
                    if (instanceId >= this.extendsInstanceId) {
                        // Extends resources
                        views.extends(this, $block, params);
                    } else {
                        // Billing resources
                        views.billing(this, $block, params);
                    }
                    
                    if ($block.className == 'block status-4') {
                        health.errors.push($block);
                    } else if ($block.className == 'block status-3') {
                        health.warnings.push($block);
                    }

                },
                sortBlocks: function() {
		    health.warnings.forEach(function(warning) {
                        health.$monitor.insertBefore(warning, health.$monitor.firstChild);
                    });
                    health.errors.forEach(function(error) {
                        health.$monitor.insertBefore(error, health.$monitor.firstChild);
                    });
                    health.criticalErrors.forEach(function(criticalError) {
                        health.$monitor.insertBefore(criticalError, health.$monitor.firstChild);
                    });
		    health.warnings = [];
		    health.errors = [];
		    health.criticalErrors = [];
                }
            },

            views = {
                billing: function ($health, $block, params) {
                    var
                        $headerInfo = $block.querySelector('div.header.info'),
                        $footerInfo = $block.querySelector('div.footer.info'),
                        regions = [];

                    if (params.regionList instanceof Object) {
                        if (Object.keys(params.regionList).length > 1) {
                            for (var index in params.regionList) {
                                 if (
                                     params.regionList.hasOwnProperty(index)
                                    && typeof params.regionList[index] == 'object'
                                    && params.regionList[index].regionId != params.instanceId
                                 ) {
                                    regions.push(params.regionList[index].regionName);
                                 }
                            }
                        } else {
                            regions.push(params.regionList[0].regionName);
                        }

                        $headerInfo.appendChild(
                            $health.create('div', {
                                class: 'pull-left',
                                text: regions.join(', ')
                            })
                        );
                    }

                    if (params.autoLockFinance !== undefined) {
                        $headerInfo.appendChild(
                            $health.create('div', {
                                class: 'pull-right' + (!params.autoLockFinance ? ' icon-dollar enabled' : '')
                            })
                        );
                    }

                    $footerInfo.appendChild(
                        $health.create('div', {
                            class: 'pull-left',
                            text: ("currentCalls" in params ? 'Calls: ' + params.currentCalls : '')
                        })
                    );
                    $footerInfo.appendChild(
                        $health.create('div', {
                            class: 'pull-right',
                            text: ("runTime" in params ? 'Runtime: ' + $health.getTimeFormat(params.runTime) : '' )
                        })
                    );
                },
                extends: function ($health, $block, params) {
                    var $footerInfo = $block.querySelector('div.footer.info');

                    if ("extendedInfo" in params) {
                        $footerInfo.innerHTML = params.extendedInfo;
                    }
                }
            };

            document.addEventListener('DOMContentLoaded', function () {
                health.init();
		health.sortBlocks();
                setInterval(function () {
                    health.load();
		    health.sortBlocks();
                }, health.requestTimeout);
            });
        })();
    </script>
    <link href="health.css" rel="stylesheet" />
</head>
<body>
    <div id="monitor">
        <div id="last-update" class="info text"></div>
    </div>
</body>
</html>
