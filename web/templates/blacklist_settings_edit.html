<form class="form-horizontal" name="form" ng-if="itemA || itemB">
    <div class="modal-header">
        <h3>Блокировка по номеру</h3>
    </div>
    <div class="modal-body">

        <!-- Nav tabs -->
        <ul class="nav nav-tabs">
            <li class="active"><a href="#blacklistsettings-list" data-toggle="tab">Блокировка по А-номеру</a></li>
            <li><a href="#blacklistsettings-b-list" data-toggle="tab">Блокировка по B-номеру</a></li>
            <li ng-repeat="prefixlist in prefixlist_block"><a href="#prefixlist-block-{{prefixlist.id}}" data-toggle="tab">{{prefixlist.name}}</a></li>
        </ul>

        <br/>

        <div class="tab-content">
            <div class="tab-pane active" id="blacklistsettings-list">
                <div class="form-group">
                    <label class="col-sm-2 control-label">Название префикслиста</label>
                    <div class="col-sm-10">
                        <input class="form-control" ng-model="itemA.name" readonly />
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Общий префикс</label>
                    <div class="col-sm-10">
                        <input class="form-control" ng-model="itemA.shared_prefix"/>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Список префиксов</label>
                    <div class="col-sm-6">
                        <textarea class="form-control" placeholder="Префиксы" ng-model="itemA.prefixes"></textarea>
                    </div>
                </div>

                <div class="form-group" ng-if="itemA && itemA.id">
                    <label class="col-sm-2 control-label"></label>
                    <div class="col-sm-6">
                        <button class="btn btn-success" ng-click="addA()">Добавить</button>
                        <button class="btn btn-danger" ng-click="deleteA()">Удалить</button>
                        <button class="btn btn-warning" ng-click="checkA()">Проверить</button>
                    </div>
                </div>
            </div>
            <div class="tab-pane" id="blacklistsettings-b-list">
                <div class="form-group">
                    <label class="col-sm-2 control-label">Название префикслиста</label>
                    <div class="col-sm-10">
                        <input class="form-control" ng-model="itemB.name" readonly />
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Общий префикс</label>
                    <div class="col-sm-10">
                        <input class="form-control" ng-model="itemB.shared_prefix"/>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Список префиксов</label>
                    <div class="col-sm-6">
                        <textarea class="form-control" placeholder="Префиксы" ng-model="itemB.prefixes"></textarea>
                    </div>
                </div>

                <div class="form-group" ng-if="itemB && itemB.id">
                    <label class="col-sm-2 control-label"></label>
                    <div class="col-sm-6">
                        <button class="btn btn-success" ng-click="addB()">Добавить</button>
                        <button class="btn btn-danger" ng-click="deleteB()">Удалить</button>
                        <button class="btn btn-warning" ng-click="checkB()">Проверить</button>
                    </div>
                </div>
            </div>

            <div ng-repeat="prefixlist in prefixlist_block" class="tab-pane" id="prefixlist-block-{{prefixlist.id}}">
                <div class="form-group">
                    <label class="col-sm-2 control-label">Название префикслиста</label>
                    <div class="col-sm-10">
                        <input class="form-control" ng-model="prefixlist.name" readonly />
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Общий префикс</label>
                    <div class="col-sm-10">
                        <input class="form-control" ng-model="prefixlist.shared_prefix"/>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Список префиксов</label>
                    <div class="col-sm-6">
                        <textarea class="form-control" placeholder="Префиксы" ng-model="prefixlist.prefixes"></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label"></label>
                    <div class="col-sm-6">
                        <button class="btn btn-success" ng-click="add(prefixlist)">Добавить</button>
                        <button class="btn btn-danger" ng-click="delete(prefixlist)">Удалить</button>
                        <button class="btn btn-warning" ng-click="check(prefixlist)">Проверить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
