<div class="form-group">
    <label class="col-sm-2 control-label">Местоположение транка</label>
    <div class="col-sm-10">
        <select ui-select2 ng-model="item.location_id" style="width: 100%" >
            <option ng-repeat="locationId in locationIds" value="{{locationId.id}}">{{locationId.name}}</option>
        </select>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-2 control-label">Перегрузка типа плеча</label>
    <div class="col-sm-10">
        <select ui-select2 ng-model="item.leg_type" style="width: 100%" >
            <option value="">-- Без значения --</option>
            <option ng-repeat="legType in legTypeList" value="{{legType.id}}">{{legType.name}}</option>
        </select>
    </div>
</div>
