<div class="panel panel-default">
    <div class="panel-heading col-sm-12">
        <h3 class="panel-title col-sm-3">{{mode.orig ? 'Оригинация' : 'Терминация'}} - {{(mode.abc_mode == 1) ? 'A' : ((mode.abc_mode == 2) ? 'B' : 'C')}}-номер</h3>
        <div class="pull-right">
            <label class="control-label">По умолчанию</label>

            <div class="btn-group" ng-click="item[mode.init] = !item[mode.init]">
                <button type="button" class="btn btn-sm {{item[mode.init] ? 'btn-success active' : 'btn-default'}}">Разрешено</button>
                <button type="button" class="btn btn-sm {{!item[mode.init] ? 'btn-danger active' : 'btn-default'}}">Запрещено</button>
            </div>
        </div>
    </div>

    <div class="form-group">
        <div class="col-sm-12">
            <table class="table table-striped">
                <tbody ui-sortable="{axis: 'y'}" ng-model="item.numbersRules[mode.key]">
                    <tr ng-repeat="line in item.numbersRules[mode.key]" ng-if="line.prefixlist_id !== null">
                        <td width="5%">
                            <button ng-if="line.allow" ng-click="line.allow = !line.allow" class="btn label label-success">Разрешено</button>
                            <button ng-if="!line.allow" ng-click="line.allow = !line.allow" class="btn label label-danger">Запрещено</button>
                        </td>
                        <td width="5%" style="cursor: ns-resize">
                            <span>Список&nbsp;префиксов:</span>
                        </td>
                        <td width="70%">
                            <select-box list="prefixlist" model="line.prefixlist_id" placeholder="Выберите"></select-box>
                        </td>
                        <td width="10%">
                            &nbsp;
                        </td>
                        <td>
                            <button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="removeNumbersRule(mode.key, $index)"></button>
                        </td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="6">
                            <button type="button" class="btn btn-success btn-xs" ng-click="addNumbersRule(mode.key)"><i class="glyphicon glyphicon-plus"></i> Список префиксов</button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
