<table class="table table-striped table-hover table-condensed" >
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th width="10%">Сервер</th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in usagesInTrunkGroups">
        <td style="cursor: pointer" ng-click="clickTrunkGroupItem(item)">{{item.id}}</td>
        <td style="cursor: pointer" ng-click="clickTrunkGroupItem(item)">{{item.name}}</td>
        <td style="cursor: pointer" ng-click="clickTrunkGroupItem(item)">{{item.server_id}}</td>
    </tr>

    </tbody>
</table>
