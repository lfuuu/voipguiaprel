<div class="form-group">
    <label class="col-sm-1 control-label">По умолчанию</label>
    <div class="col-sm-10">
        <div class="btn-group" ng-click="item.source_rule_rn_default_allowed = !item.source_rule_rn_default_allowed">
            <button type="button" class="btn {{item.source_rule_rn_default_allowed ? 'btn-success active' : 'btn-default'}}">Разрешено</button>
            <button type="button" class="btn {{!item.source_rule_rn_default_allowed ? 'btn-danger active' : 'btn-default'}}">Запрещено</button>
        </div>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-1 control-label">Правила</label>
    <div class="col-sm-10">
        <table class="table table-striped">
            <tbody ui-sortable="{axis: 'y'}" ng-model="item.trunkRulesRn">
            <tr ng-repeat="line in item.trunkRulesRn">
                <td width="5%">
                    <button ng-if="line.allow" ng-click="line.allow = !line.allow" class="btn label label-success">Разрешено</button>
                    <button ng-if="!line.allow" ng-click="line.allow = !line.allow" class="btn label label-danger">Запрещено</button>
                </td>
                <td width="5%" style="cursor: ns-resize">
                    <span ng-if="line.trunk_group_id !== null">Группа&nbsp;транков:</span>
                </td>
                <td>
                    <select-box list="trunkGroup" model="line.trunk_group_id" default="Любая группа"></select-box>
                </td>

                <td width="3%" style="cursor: ns-resize">
                    <span ng-if="line.number_id_filter_a !== null">A:</span>
                </td>
                <td>
                    <select-box list="number" model="line.number_id_filter_a" param="1" default="Любой номер"></select-box>
                </td>

                <td width="3%" style="cursor: ns-resize">
                    <span ng-if="line.number_id_filter_b !== null">B:</span>
                </td>
                <td>
                    <select-box list="number" model="line.number_id_filter_b" param="2" default="Любой номер"></select-box>
                </td>

                <td width="3%" style="cursor: ns-resize">
                    <span ng-if="line.number_id_filter_c !== null">C:</span>
                </td>
                <td>
                    <select-box list="number" model="line.number_id_filter_c" param="3" default="Любой номер"></select-box>
                </td>
                <td style="padding-bottom: 3px;padding-right: 1px;padding-left: 1px; min-width: 40px;">
                    <span>A || C</span>
                </td>
                <td style="padding-bottom: 3px;padding-right: 1px;padding-left: 1px; min-width: 70px;" width="7%" ">
                    <div class="btn-group" ng-click="line.ac_mode = !line.ac_mode">
                        <button type="button" class="btn btn-sm {{line.ac_mode ? 'btn-success active' : 'btn-default'}}">Да</button>
                        <button type="button" class="btn btn-sm {{!line.ac_mode ? 'btn-primary active' : 'btn-default'}}">Нет</button>
                    </div>
                </td>
                <td>
                    <comment-icon key="{{line.id}}" type="trunk_rules" comment="line.object_comment"></comment-icon>
                </td>
                <td>
                    <button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="removeTrunkRuleRoutingNum($index)"></button>
                </td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <td colspan="11">
                    <button type="button" class="btn btn-success btn-xs" ng-click="addTrunkRuleRoutingNum()"><i class="glyphicon glyphicon-plus"></i> Группа транков</button>
                </td>
            </tr>
            </tfoot>
        </table>
    </div>
</div>
