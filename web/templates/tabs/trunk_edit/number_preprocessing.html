<div class="form-group">
    <label class="col-sm-1 control-label">Препроцессинг номеров</label>
    <div class="col-sm-11">
        <table class="table table-striped">
            <tbody ui-sortable="{axis: 'y'}" ng-model="item.numberPreprocessing">
            <tr ng-repeat="line in item.numberPreprocessing">
                <td width="7%" style="cursor: ns-resize">
                    <span ng-if="line.abc_mode == 1" class="label label-default">A-номер</span>
                    <span ng-if="line.abc_mode == 2" class="label label-default">B-номер</span>
                    <span ng-if="line.abc_mode == 3" class="label label-default">C-номер</span>
                </td>
                <td> <input type="checkbox" class="col-sm-8"  ng-checked="line.auth" ng-click="line.auth=!line.auth">Auth</input> </td>
                <td> <input type="checkbox" class="col-sm-8"  ng-checked="line.acc" ng-click="line.acc=!line.acc">Acc</input> </td>
                <td width="15%">
                    <select ui-select2 ng-model="line.mod_type" placeholder="round" style="width: 100%" >
                        <option ng-repeat="numPreproc in trunkNumberPreprocessingType" value="{{numPreproc.id}}">{{numPreproc.name}}</option>
                    </select>
                </td>
                <td style="cursor: ns-resize">
                    <div style="display: grid; grid-template-columns: 50px 50px 70px repeat(7, 1fr)">
                        <div class="preprocessing-child preprocessing-child-title">NOA:</div>
                        <div class="preprocessing-child"><input class="form-control input-sm" style="width: 25px;" ng-model="line.noa"/></div>
                        <div ng-if="preprocPrefix(line)" class="preprocessing-child">Длина номера:</div>
                        <div ng-if="preprocPrefix(line)" class="preprocessing-child"><input class="form-control input-sm" style="width: 45px;" ng-model="line.length" required /></div>
                        <div ng-if="preprocPrefix(line)" class="preprocessing-child preprocessing-child-title">Префикс:</div>
                        <div ng-if="preprocPrefix(line)" class="preprocessing-child"><input class="form-control input-sm" style="width: 65px;" ng-model="line.prefix" required /></div>
                        <div ng-if="preprocPosRange(line)" class="preprocessing-child preprocessing-child-title">Начало:</div>
                        <div ng-if="line.mod_type == 1" class="preprocessing-child preprocessing-child-title">Позиция:</div>
                        <div ng-if="preprocPosRange(line) || line.mod_type == 1" class="preprocessing-child"><input class="form-control input-sm" style="width: 30px;" ng-model="line.start_pos" required /></div>
                        <div ng-if="preprocPosRange(line)" class="preprocessing-child preprocessing-child-title">Конец:</div>
                        <div ng-if="preprocPosRange(line)" class="preprocessing-child"><input class="form-control input-sm" style="width: 30px;" ng-model="line.end_pos" required /></div>
                        <div ng-if="preprocValue(line)" class="preprocessing-child preprocessing-child-title">Regex:</div>
                        <div ng-if="preprocValue(line)" class="preprocessing-child"><input class="form-control input-sm" style="width: 170px;" ng-model="line.regex" /></div>
                        <div ng-if="preprocValue(line)" class="preprocessing-child preprocessing-child-title">Значение:</div>
                        <div ng-if="preprocValue(line)" class="preprocessing-child"><input class="form-control input-sm" style="width: 85px;" ng-model="line.mod_value" required /></div>
                    </div>
                </td>

                <td> <input type="checkbox" class="col-sm-8"  ng-checked="line.avoid_mod" ng-click="line.avoid_mod=!line.avoid_mod">Без модификаторов</input> </td>
                <td>
                    <comment-icon key="{{line.id}}" type="trunk_preprocessing" comment="line.object_comment"></comment-icon>
                </td>
                <td>
                    <button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="removeNumberPreprocessing($index)"></button>
                </td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <td colspan="8">
                    <button type="button" class="btn btn-success btn-xs" ng-click="addNumberPreprocessing(1)"><i class="glyphicon glyphicon-plus"></i> А-номер</button>
                    <button type="button" class="btn btn-success btn-xs" ng-click="addNumberPreprocessing(2)"><i class="glyphicon glyphicon-plus"></i> B-номер</button>
                    <button type="button" class="btn btn-success btn-xs" ng-click="addNumberPreprocessing(3)"><i class="glyphicon glyphicon-plus"></i> C-номер</button>
                </td>
            </tr>
            </tfoot>
        </table>
    </div>
</div>
