<form class="form-horizontal" name="form" ng-if="prefixlist">
    <div class="modal-header">
        <h3 ng-if="prefixlist.id">Результаты пересчета префикcлиста "{{prefixlist.name}}"</h3>
    </div>
    <div class="modal-body">

        <div class="text-center">
            <div class="alert alert-danger" ng-if="!canProcess">Нет данных о префикслисте</div>
            <div class="alert alert-danger" ng-if="processFailer">{{processFailer}}</div>
            <div class="alert alert-info" ng-if="canProcess">Идет обработка...</div>
        </div>

    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
