<div ng-if="userPermissions['api_billing_api_create']" class="pull-right">
    <a class="btn btn-primary btn-sm" ng-click="clickCreate()">Создать</a>
</div>
<h4>Список API</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed">
    <thead>
        <tr>
            <th width="3%">
                <a href="#" ng-click="sortType = 'id'; sortReverse = !sortReverse">
                    ID
                    <span ng-show="sortType == 'id' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'id' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'server_id'; sortReverse = !sortReverse">
                    Регион
                    <span ng-show="sortType == 'server_id' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'server_id' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="30%">
                <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                    Название
                    <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="20%">
                <a href="#" ng-click="sortType = 'api_sig'; sortReverse = !sortReverse">
                    Технический код
                    <span ng-show="sortType == 'api_sig' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'api_sig' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="15%">
                <a href="#" ng-click="sortType = 'description'; sortReverse = !sortReverse">
                    Описание
                    <span ng-show="sortType == 'description' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'description' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="1%"></th>
            <th ng-if="userPermissions['api_billing_api_delete']" width="1%"></th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="item in list | orderBy:sortType:sortReverse | trunkFilter:searchQuery:filterFields">
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.server_id}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.api_sig}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.description}}</td>
            <td>
                <comment-icon ng-if="item.id" key="{{item.id}}" type="ApiBillingApi" comment="item.object_comment"></comment-icon>
            </td>
            <td ng-if="userPermissions['api_billing_api_delete']"><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button></td>
        </tr>
    </tbody>
</table>
