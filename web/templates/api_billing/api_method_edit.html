<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">Метод API {{item.name}}</h3>
        <h3 ng-if="!item.id">Создание метода API</h3>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label class="col-sm-2 control-label">Название</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Название" ng-model="item.name" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">API</label>
            <div class="col-sm-10">
                <api-billing-select-box list="api" model="item.api_id"></api-billing-select-box>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Технический код</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Технический код" ng-model="item.method_sig" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Описание</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Описание" ng-model="item.description">
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
            <action-log-view-button ng-if="item.id && userPermissions['action_log_view']" key="{{item.id}}" type="json/camel/gt"></action-log-view-button>
        </div>
    </div>

</form>
