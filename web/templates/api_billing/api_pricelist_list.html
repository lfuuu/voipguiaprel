<div ng-if="userPermissions['api_billing_api_pricelist_create']" class="pull-right">
    <a class="btn btn-primary btn-sm" ng-click="clickCreate()">Создать</a>
</div>
<h4>Список прайслистов</h4>

<style>
    .table {
        width: 100%;
        table-layout: auto;
        border-collapse: collapse;
    }
    th, td {
        text-align: center;
        vertical-align: middle;
        white-space: nowrap;
        padding: 10px;
    }
    .actions-column {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: nowrap;
    }
    .actions-column button {
        flex-shrink: 0;
    }
    .btn-danger {
        width: auto;
    }
    th {
        background-color: #f5f5f5;
        font-weight: bold;
    }
    .form-group {
        margin-bottom: 20px;
    }
</style>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed">
    <thead>
        <tr>
            <th width="5%">
                <a href="#" ng-click="sortType = 'id'; sortReverse = !sortReverse">
                    ID
                    <span ng-show="sortType == 'id' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'id' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th>
                <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                    Название
                    <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="item in list | orderBy:sortType:sortReverse | trunkFilter:searchQuery:filterFields">
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
            <td class="actions-column">
                <button type="button" class="btn btn-default btn-sm" ng-click="copyItem(item)">Копировать</button>
                <button type="button" class="btn btn-default btn-sm" ng-click="copyAndMultiplyItem(item)">Умножить</button>
                <button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button>
            </td>
        </tr>
    </tbody>
</table>
