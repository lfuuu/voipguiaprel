<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">Элемент прайслиста {{item.id}}</h3>
        <h3 ng-if="!item.id">Создание элемента прайслиста</h3>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label class="col-sm-2 control-label">API</label>
            <div class="col-sm-10">
                <api-billing-select-box list="api" model="item.api_id"></api-billing-select-box>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Метод API</label>
            <div class="col-sm-10">
                <api-billing-select-box list="apiMethod" model="item.api_method_id"></api-billing-select-box>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Цена</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="0.01" ng-model="item.price" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Себестоимость</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="0.00" ng-model="item.cost">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Прайслист</label>
            <div class="col-sm-10">
                <api-billing-select-box list="apiPricelist" model="item.pricelist_id"></api-billing-select-box>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Включено</label>
            <div class="col-sm-10">
                <div class="btn-group" ng-click="item.enabled = !item.enabled">
                    <button type="button" class="btn btn-sm {{item.enabled ? 'btn-success active' : 'btn-default'}}">Да</button>
                    <button type="button" class="btn btn-sm {{!item.enabled ? 'btn-primary active' : 'btn-default'}}">Нет</button>
                </div>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
            <action-log-view-button ng-if="item.id && userPermissions['action_log_view']" key="{{item.id}}" type="json/billing-api/api-pricelist-item"></action-log-view-button>
        </div>
    </div>

</form>
