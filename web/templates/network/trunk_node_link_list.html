<div>
    <h4>Связи узлов с логическими транками</h4>
    <!-- Форма фильтра (ленточная) -->
    <form class="form-inline" ng-hide="hideFilter" style="margin-bottom: 15px;">
      <div class="form-group" style="margin-left: 15px;">
        <label class="col-sm-3 search-field-label">Узел:</label>
        <div class="col-sm-9 search-input">
        <select class="form-control" 
                ng-model="filterObj.node_id_selected" 
                ng-change="clickSearch()"
                ui-select2 style="width: 250px;">
          <option value="">-- Все узлы --</option>
          <option ng-repeat="n in nodesList" value="{{n.id}}">{{n.name_display}}</option>
        </select>
    </div>
      </div>
      <div class="form-group" style="margin-left: 15px;">
        <label>ID Логического Транка:</label>
        <input type="number" class="form-control" 
               ng-model="filterObj.service_trunk_id" 
               placeholder="ID транка" 
               ng-keydown="$event.keyCode === 13 && clickSearch()">
      </div>
      <a class="btn btn-primary search-form-button" ng-click="clickCreate()">Создать</a>
    </form>

  </div>
  
  <table class="table table-striped table-hover table-condensed">
    <thead>
      <tr>
        <th>
          <a href="#" ng-click="sortType = 'trunk_node_link_id'; sortReverse = !sortReverse">
            ID
            <span ng-show="sortType == 'trunk_node_link_id' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'trunk_node_link_id' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <th>
          <a href="#" ng-click="sortType = 'service_trunk_id'; sortReverse = !sortReverse">
            ID Логического Транка
            <span ng-show="sortType == 'service_trunk_id' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'service_trunk_id' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <th>
          <a href="#" ng-click="sortType = 'node_display'; sortReverse = !sortReverse">
            Узел
            <span ng-show="sortType == 'node_display' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'node_display' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <th>
          <a href="#" ng-click="sortType = 'comment'; sortReverse = !sortReverse">
            Комментарий
            <span ng-show="sortType == 'comment' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'comment' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <th>&nbsp;</th>
      </tr>
    </thead>
    <tbody>
      <tr ng-repeat="link in links | filter:customFilter | orderBy:sortType:sortReverse track by link.trunk_node_link_id">
        <td style="cursor: pointer" ng-click="clickItem(link)">{{ link.trunk_node_link_id }}</td>
        <td>{{ link.service_trunk_id }}</td>
        <td style="cursor: pointer" ng-click="clickNode(link.node_id)">{{ link.node_display }}</td>
        <td>{{ link.comment }}</td>
        <td>
          <button type="button" class="btn btn-warning btn-sm glyphicon glyphicon-pencil" ng-click="clickItem(link)"></button>
          <button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(link)"></button>
        </td>
      </tr>
    </tbody>
  </table>
