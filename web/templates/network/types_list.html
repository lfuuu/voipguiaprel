<div>
    <h4>Список типов</h4>
    <table class="table table-striped table-hover table-condensed">
      <thead>
        <tr>
          <th>ID</th>
          <th>Тип</th>
          <th>Комментарий</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="type in types | orderBy:'node_type_id'">
          <td>{{ type.node_type_id }}</td>
          <td>{{ type.node_type }}</td>
          <td>{{ type.comment }}</td>
        </tr>
      </tbody>
    </table>
  </div>
