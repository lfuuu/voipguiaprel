<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
      <h3 ng-if="item.node_link_id">Редактирование транка №{{item.node_link_id}}</h3>
      <h3 ng-if="!item.node_link_id">Создание нового транка</h3>
    </div>
    <div class="modal-body">
  
      <!-- Узел №1 -->
      <div class="form-group">
        <label class="col-sm-2 control-label">Узел №1</label>
        <div class="col-sm-10">
          <input type="number"
                 class="form-control"
                 ng-model="item.src_node_id"
                 placeholder="Узел №1"
                 required>
        </div>
      </div>
  
      <!-- Узел №2 -->
      <div class="form-group">
        <label class="col-sm-2 control-label">Узел №2</label>
        <div class="col-sm-10">
          <input type="number"
                 class="form-control"
                 ng-model="item.dst_node_id"
                 placeholder="Узел №2"
                 required>
        </div>
      </div>
       
      <!-- Вес -->
      <div class="form-group">
        <label class="col-sm-2 control-label">Вес</label>
        <div class="col-sm-10">
          <input type="number"
                 class="form-control"
                 ng-model="item.weight"
                 placeholder="Вес"
                 required>
        </div>
      </div>
  
      <!-- Имя транка -->
      <div class="form-group">
        <label class="col-sm-2 control-label">Имя транка</label>
        <div class="col-sm-10">
          <input type="text"
                 class="form-control"
                 ng-model="item.trunk_name"
                 placeholder="Имя транка">
        </div>
      </div>
  
      <!-- Комментарий -->
      <div class="form-group">
        <label class="col-sm-2 control-label">Комментарий</label>
        <div class="col-sm-10">
          <textarea class="form-control"
                    ng-model="item.comment"
                    placeholder="Комментарий"></textarea>
        </div>
      </div>
  
    </div>
    <div class="modal-footer">
      <button type="submit"
              class="btn btn-primary"
              ng-click="save()"
              ng-disabled="form.$invalid || $root.isAjaxLoading">
        Сохранить
      </button>
      <button type="button" class="btn btn-default" ng-click="back()">Закрыть</button>
    </div>
  </form>
