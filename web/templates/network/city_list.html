<div>
    <h4>Список городов РФ</h4>
    <table class="table table-striped table-hover table-condensed">
      <thead>
        <tr>
          <th>ID</th>
          <th>Город</th>
          <th>ID субъекта</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="city in cities | orderBy:'russian_city_id' track by city.russian_city_id">
          <td>{{ city.russian_city_id }}</td>
          <td>{{ city.russian_city }}</td>
          <td>{{ city.russian_subject_id }}</td>
        </tr>
      </tbody>
    </table>
  </div>
