<div>
    <h4>Список статусов узлов</h4>
    <table class="table table-striped table-hover table-condensed">
      <thead>
        <tr>
          <th>ID</th>
          <th>Статус</th>
          <th>Комментарий</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="status in statuses | orderBy:'node_status_id' track by $index">
            <td>{{ status.node_status_id }}</td>
            <td>{{ status.node_status }}</td>
            <td>{{ status.comment }}</td>
          </tr>
          
      </tbody>
    </table>
  </div>
