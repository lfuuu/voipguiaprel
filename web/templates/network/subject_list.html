<div>
    <h4>Список субъектов РФ</h4>
    <table class="table table-striped table-hover table-condensed">
      <thead>
        <tr>
          <th>ID</th>
          <th>Субъект РФ</th>
          <th>ID федерального округа</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="subject in subjects | orderBy:'russian_subject_id' track by subject.russian_subject_id">
          <td>{{ subject.russian_subject_id }}</td>
          <td>{{ subject.russian_subject }}</td>
          <td>{{ subject.russian_district_id }}</td>
        </tr>
      </tbody>
    </table>
  </div>
