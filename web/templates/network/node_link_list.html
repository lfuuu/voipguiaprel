<div>
    <!-- Кнопка создания нового транка -->
    <a class="btn btn-primary search-form-button" ng-click="clickCreate()">Создать</a>
    <!-- Кнопки для "Скрыть фильтр" и "Показать фильтр", если нужно -->
    <!--
    <button type="submit" ng-hide="hideFilter" class="btn btn-warning search-form-button" ng-click="hideFilter = true">Скрыть фильтр</button>
    <button type="submit" ng-hide="!hideFilter" class="btn btn-info search-form-button" ng-click="hideFilter = false">Показать фильтр</button>
    -->
  </div>
  
  <h4>Список транков</h4>
  
  <!-- Форма фильтра (ленточная) -->
  <form ng-hide="hideFilter">
    <div class="form-group">
      <div class="row">
        <!-- ЕДИНЫЙ фильтр "Узел" -->
        <div class="form-group col-sm-3 search-form-item first-form-item">
          <label class="col-sm-3 search-field-label">Узел</label>
          <div class="col-sm-9 search-input">
            <select class="search-form-select"
                    ui-select2
                    style="width: 100%"
                    placeholder="Выберите узел"
                    ng-model="filterObj.node_id_selected"
                    ng-change="clickSearch()">
              <option value="">-- Все узлы --</option>
              <!-- При условии, что nodesList загружен через Node.listNodesForLink() или аналог -->
              <option ng-repeat="n in nodesList" value="{{n.id}}">
                {{n.name_display}}
              </option>
            </select>
          </div>
        </div>
        <!-- Можно добавить другие поля для фильтра, если нужно -->
      </div>
    </div>
  </form>
  
  <table class="table table-striped table-hover table-condensed">
    <thead>
      <tr>
        <th>
          <a href="#" ng-click="sortType = 'node_link_id'; sortReverse = !sortReverse">
            ID
            <span ng-show="sortType == 'node_link_id' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'node_link_id' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <!-- Узел №1 -->
        <th>
          <a href="#" ng-click="sortType = 'src_node_id'; sortReverse = !sortReverse">
            Узел №1
            <span ng-show="sortType == 'src_node_id' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'src_node_id' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <!-- Узел №2 -->
        <th>
          <a href="#" ng-click="sortType = 'dst_node_id'; sortReverse = !sortReverse">
            Узел №2
            <span ng-show="sortType == 'dst_node_id' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'dst_node_id' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <!-- Вес -->
        <th>
          <a href="#" ng-click="sortType = 'weight'; sortReverse = !sortReverse">
            Вес
            <span ng-show="sortType == 'weight' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'weight' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <!-- Имя транка -->
        <th>
          <a href="#" ng-click="sortType = 'trunk_name'; sortReverse = !sortReverse">
            Имя транка
            <span ng-show="sortType == 'trunk_name' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'trunk_name' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <!-- Колонка с кнопками "Редактировать" и "Удалить" -->
        <th>&nbsp;</th>
      </tr>
    </thead>
    <tbody>
      <!-- Используем кастомный фильтр: customFilter -->
      <tr ng-repeat="item in list | filter:customFilter | orderBy:sortType:sortReverse">
        <!-- ID транка, при клике редактируем сам транк -->
        <td>
          {{item.node_link_id}}
        </td>
        <!-- Узел №1 (src_node_display) -->
        <td style="cursor: pointer" ng-click="clickSrcNode(item.src_node_id)">
          {{item.src_node_display}}
        </td>
        <!-- Узел №2 (dst_node_display) -->
        <td style="cursor: pointer" ng-click="clickDstNode(item.dst_node_id)">
          {{item.dst_node_display}}
        </td>
        <!-- Вес -->
        <td>{{item.weight}}</td>
        <!-- Имя транка -->
        <td>{{item.trunk_name}}</td>
        <!-- Колонка с кнопками -->
        <td>
          <!-- Кнопка "Редактировать" (иконка карандаша) -->
          <button type="button"
                  class="btn btn-warning btn-sm glyphicon glyphicon-pencil"
                  style="margin-right: 5px"
                  ng-click="clickItem(item)"></button>
  
          <!-- Кнопка "Удалить" (иконка минус) -->
          <button type="button"
                  class="btn btn-danger btn-sm glyphicon glyphicon-minus"
                  ng-click="deleteItem(item)"></button>
        </td>
      </tr>
    </tbody>
  </table>
