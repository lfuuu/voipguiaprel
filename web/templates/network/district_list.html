<div>
    <h4>Список федеральных округов</h4>
    <table class="table table-striped table-hover table-condensed">
      <thead>
        <tr>
          <th>ID</th>
          <th>Округ</th>
          <th>Краткое наименование</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="district in districts | orderBy:'russian_district_id' track by district.russian_district_id">
          <td>{{ district.russian_district_id }}</td>
          <td>{{ district.russian_district }}</td>
          <td>{{ district.russian_district_short }}</td>
        </tr>
      </tbody>
    </table>
  </div>
