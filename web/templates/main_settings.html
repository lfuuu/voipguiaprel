<div class="wrap">
    <div style="position: fixed; left: 15px; bottom: 0; top: 60px; width: 230px; overflow-y: auto">
        <div ng-if="userPermissions['acl_list'] || userPermissions['role_list'] || userPermissions['user_list']" class="list-group">
            <a class="list-group-item" ng-if="userPermissions['acl_list']" ng-click="Redirect.aclList()" ng-class="{active:tabs.isController('AclListCtrl')}">Права доступа</a>
            <a class="list-group-item" ng-if="userPermissions['role_list']" ng-click="Redirect.roleList()" ng-class="{active:tabs.isController('RoleListCtrl')}">Роли</a>
            <a class="list-group-item" ng-if="userPermissions['user_list']" ng-click="Redirect.userList()" ng-class="{active:tabs.isController('UserListCtrl')}">Пользователи</a>
        </div>
        <div ng-if="userPermissions['action_log_list']" class="list-group">
            <a class="list-group-item" ng-if="userPermissions['action_log_list']" ng-click="Redirect.actionLogList()" ng-class="{active:tabs.isController('ActionLogListCtrl')}">История</a>
        </div>
    </div>

    <div style="position: fixed; overflow: auto; bottom: 0; right: 0; top: 60px; padding-left: 20px; padding-right: 20px; left: 250px;':'left: 0;">
        <tabset class="main-tabs" ng-show="tabs.length > 0" vertical="true" type="'pills'">
            <tab ng-repeat="tab in tabs" active="tab.active" ng-controller="tab.controller">
                <ng-include src="tab.template" onload="init(tab)"></ng-include>
            </tab>
        </tabset>
    </div>
</div>

<div id="popup-alert" class="alert alert-danger" style="cursor: pointer; position: absolute; left: 20%; right: 20%; top: 45px; z-index: 5000;" ng-if="popupErrors"  ng-click="closeErrorsPopup()">
    <button type="button" class="close" ng-click="closeErrorsPopup()"><span aria-hidden="true">×</span></button>
    <h4 ng-if="popupErrors.header">{{popupErrors.header}}</h4>
    <p ng-repeat="error in popupErrors.errors">{{error}}</p>
</div>
