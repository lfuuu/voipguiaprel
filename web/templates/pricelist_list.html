<h4>
    Прайслисты
    <button ng-if="userPermissions['pricelist_create']" type="submit" class="btn btn-primary search-form-button" ng-click="clickCreate()">Создать</button>
    <button type="submit" class="btn btn-success search-form-button" ng-click="clickSearch()">Поиск</button>
    <button type="submit" ng-hide="hideFilter" class="btn btn-warning search-form-button" ng-click="hideFilter = true">Скрыть фильтр</button>
    <button type="submit" ng-hide="!hideFilter" class="btn btn-info search-form-button" ng-click="hideFilter = false">Показать фильтр</button>
</h4>

<form ng-hide="hideFilter">
    <div class="form-group">
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
                <label class="col-sm-2 search-field-label">Название</label>
                <div class="col-sm-10 search-input">
                    <input type="text" class="form-control" placeholder="Поиск" ng-model="searchArray.query">
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Группа</label>
                <div class="col-sm-10 search-input">
                    <select class="search-form-select" ui-select2 style="width: 100%" tags="true" placeholder="Группа" ng-model="searchArray.group_id" required>
                        <option value="">-- Выберите группу --</option>
                        <option value="all">Все группы</option>
                        <option ng-repeat="group in groupList" value="{{group.id}}">{{group.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Тип</label>
                <div class="col-sm-10 search-input">
                    <select class="search-form-select" ui-select2 style="width: 100%" placeholder="Тип услуги" ng-model="searchArray.service_type_id" required>
                        <option value="">-- Выберите тип услуги --</option>
                        <option value="1">Голос</option>
                        <option value="2">СМС</option>
                        <option value="3">Data</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</form>

<div>
    <pagination style="display: inline;" total-items="totalItems" items-per-page="limit" page="currentPage" on-select-page="setPagingData(page)"></pagination>
</div>

<table class="table table-striped table-hover table-condensed">
    <thead>
    <tr>
        <th width="5%">
            <a href="#" ng-click="sortType = 'id'; sortReverse = !sortReverse">
                ID
                <span ng-show="sortType == 'id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="20%">
            <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                Название
                <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="10%">
            <a href="#" ng-click="sortType = 'currency_id'; sortReverse = !sortReverse">
                Валюта
                <span ng-show="sortType == 'currency_id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'currency_id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="10%">
            <a href="#" ng-click="sortType = 'group_name'; sortReverse = !sortReverse">
                Группа
                <span ng-show="sortType == 'group_name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'group_name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="10%">
            <a href="#" ng-click="sortType = 'type_id'; sortReverse = !sortReverse">
                Тип
                <span ng-show="sortType == 'type_id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'type_id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="25%"></th>
        <th width="10%">
            <a href="#" ng-click="sortType = 'date_created'; sortReverse = !sortReverse">
                Дата создания
                <span ng-show="sortType == 'date_created' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'date_created' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="10%">
            <a href="#" ng-click="sortType = 'date_start'; sortReverse = !sortReverse">
                Дата активации
                <span ng-show="sortType == 'date_start' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'date_start' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th ng-if="userPermissions['pricelist_create']">&nbsp;</th>
        <th ng-if="userPermissions['pricelist_create']">&nbsp;</th>
        <th ng-if="userPermissions['pricelist_edit']">&nbsp;</th>
        <th ng-if="userPermissions['pricelist_delete']">&nbsp;</th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list | orderBy:sortType:sortReverse">
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.currency_id}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.group_name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <span ng-if="item.type_id == 1">Розница</span>
            <span ng-if="item.type_id == 2">Оператор</span>
            <span ng-if="item.type_id == 3">ОТТ</span>
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <span class="label label-success" ng-if="item.service_type_id == 1">Голос</span>
            <span class="label label-success" ng-if="item.service_type_id == 2">СМС</span>
            <span class="label label-success" ng-if="item.service_type_id == 3">Data</span>
            <span class="label label-success" ng-if="item.orig">ORIG</span>
            <span class="label label-info" ng-if="!item.orig">TERM</span>
            <span class="label label-success" ng-if="item.is_global">Глобальный</span>
            <span class="label label-success" ng-if="item.is_active">Активный</span>
            <span class="label label-danger" ng-if="item.is_in_use">В коммерции</span>
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.date_created}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.date_start}}</td>
        <td ng-if="userPermissions['pricelist_create']">
            <button type="button" class="btn btn-default btn-sm"
                    ng-click="copyItem(item)">Копировать</button>
        </td>
        <td ng-if="userPermissions['pricelist_create']">
            <button type="button" class="btn btn-default btn-sm"
                    ng-click="copyAndMultiplyItem(item)">Умножить</button>
        </td>
        <td ng-if="userPermissions['pricelist_create']">
            <button type="button" ng-hide="!item.is_active || item.is_in_use" class="btn btn-default btn-sm"
                    ng-click="toggleActive(item)">Деактивировать</button>
            <button type="button" ng-hide="item.is_active" class="btn btn-default btn-sm"
                    ng-click="toggleActive(item)">Активировать</button>
        </td>
        <td ng-if="userPermissions['pricelist_delete']">
            <button type="button" ng-hide="item.is_active" class="btn btn-danger btn-sm glyphicon glyphicon-minus"
                    ng-click="deleteItem(item)"></button>
        </td>
    </tr>

    </tbody>
</table>
