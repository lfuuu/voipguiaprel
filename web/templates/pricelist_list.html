<div ng-if="userPermissions['pricelist_create']">
    <a class="btn btn-primary btn-sm pull-right" ng-click="clickCreate()">Создать</a>
</div>
<h4>Прайслисты</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed">
    <thead>
    <tr>
        <th width="5%">
            <a href="#" ng-click="sortType = 'id'; sortReverse = !sortReverse">
                ID
                <span ng-show="sortType == 'id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="20%">
            <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                Название
                <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="20%">
            <a href="#" ng-click="sortType = 'orig'; sortReverse = !sortReverse">
                Тип
                <span ng-show="sortType == 'orig' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'orig' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="20%">
            <a href="#" ng-click="sortType = 'date_created'; sortReverse = !sortReverse">
                Дата создания
                <span ng-show="sortType == 'date_created' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'date_created' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="20%">
            <a href="#" ng-click="sortType = 'date_end'; sortReverse = !sortReverse">
                Дата окончания действия
                <span ng-show="sortType == 'date_end' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'date_end' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="15%">
            <a href="#" ng-click="sortType = 'is_global'; sortReverse = !sortReverse">
                Глобальный
                <span ng-show="sortType == 'is_global' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'is_global' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th ng-if="userPermissions['pricelist_create']">&nbsp;</th>
        <th ng-if="userPermissions['pricelist_delete']">&nbsp;</th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list | orderBy:sortType:sortReverse | basicFilter:searchQuery:filterFields">
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <span ng-if="item.orig">Оригинация</span>
            <span ng-if="!item.orig">Терминация</span>
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.date_created}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.date_end}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <span ng-if="item.is_global">Да</span>
            <span ng-if="!item.is_global">Нет</span>
        </td>
        <td ng-if="userPermissions['pricelist_create']">
            <button type="button" class="btn btn-default btn-sm"
                    ng-click="cloneItem(item)">Клонировать</button>
        </td>
        <td ng-if="userPermissions['pricelist_delete']">
            <button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus"
                    ng-click="deleteItem(item)"></button>
        </td>
    </tr>

    </tbody>
</table>
