<div ng-if="userPermissions['major_create']">
    <a class="btn btn-primary btn-sm pull-right" ng-click="clickCreate()">Создать</a>
</div>
<h4>NNP-фильтры</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <div class="row">
                <div class="form-group col-sm-6">
                    <select ui-select2 style="width: 100%" tags="true" ng-change="countryChanged(countryCode)" placeholder="Страна" ng-model="countryCode" required>
                        <option value="undefined">-- Выберите страну --</option>
                        <option ng-repeat="country in countryList" value="{{country.code}}">{{country.name_rus}}</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed">
    <thead>
    <tr>
        <th width="10%">
            ID
        </th>
        <th width="10%">
            Позиция
        </th>
        <th width="40%">
            Название
        </th>
        <th width="40%">
            Страна
        </th>
        <th ng-if="userPermissions['major_edit']">&nbsp;</th>
        <th ng-if="userPermissions['major_edit']">&nbsp;</th>
        <th ng-if="userPermissions['major_delete']">&nbsp;</th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list">
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.order}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.country_name}}</td>
        <td ng-if="userPermissions['major_edit']">
            <button type="button" ng-hide="$first" class="btn btn-success btn-sm glyphicon glyphicon-arrow-up"
                    ng-click="move(item.id, 'up')"></button>
        </td>
        <td ng-if="userPermissions['major_edit']">
            <button type="button" ng-hide="$last" class="btn btn-success btn-sm glyphicon glyphicon-arrow-down"
                    ng-click="move(item.id, 'down')"></button>
        </td>
        <td ng-if="userPermissions['major_delete']">
            <button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus"
                    ng-click="deleteItem(item)"></button>
        </td>
    </tr>

    </tbody>
</table>
