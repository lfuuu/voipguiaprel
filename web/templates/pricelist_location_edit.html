<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">Местоположение, id {{item.id}}</h3>
        <h3 ng-if="!item.id">Создание местоположения</h3>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label class="col-sm-2 control-label">Описание</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Описание" ng-model="item.description">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">MCC</label>
            <div class="col-sm-10">
                <select ui-select2 ng-model="item.mcc" multiple="multiple" style="width: 100%" >
                    <option ng-repeat="mcc in mccList" value="{{::mcc.id}}">#{{mcc.mcc}} {{::mcc.name}}</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">MNC</label>
            <div class="col-sm-10">
                <select ui-select2 ng-model="item.mnc" multiple="multiple" style="width: 100%" >
                    <option ng-repeat="mnc in mncList" value="{{mnc.id}}">#{{mnc.mnc}} {{mnc.name}}</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Sim Партнер</label>
            <div class="col-sm-10">
                <select ui-select2 ng-model="item.sim_partner" multiple="multiple" style="width: 100%" >
                    <option ng-repeat="partner in partnerList" value="{{partner.id}}">#{{partner.id}} {{partner.name}}</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Sim Профиль</label>
            <div class="col-sm-10">
                <select ui-select2 ng-model="item.sim_profile" multiple="multiple" style="width: 100%" >
                    <option ng-repeat="profile in profileList" value="{{profile.id}}">#{{profile.id}} {{profile.name}}</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Добавочная цена</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="1.234" ng-model="item.delta_price">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Местоположение</label>
            <div class="col-sm-10">
                <select ui-select2 ng-model="item.location_id" placeholder="Местоположение" style="width: 100%">
                    <option ng-repeat="locationItem in location" value="{{locationItem.id}}">{{locationItem.name}}</option>
                </select>
            </div>
        </div>

        <div ng-if="pricelistServiceTypeId == 3" class="form-group">
            <label class="col-sm-2 control-label">Порог округления</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="1.234" ng-model="item.rounding_threshold">
            </div>
        </div>


    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success"
                    ng-if="(item.id && userPermissions['pricelist_edit']) || (!item.id && userPermissions['pricelist_create'])"
                    ng-disabled="form.$invalid || (!userPermissions['pricelist_super_edit'] && pricelistIsActive)"
                    ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
            <action-log-view-button ng-if="item.id && userPermissions['action_log_view']" key="{{item.id}}" type="json/pricelist-location"></action-log-view-button>
        </div>
    </div>

</form>
