<form class="form-horizontal" name="form">
    <div class="modal-header">
        <h3>Выберите оператора Россвязь</h3>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label class="col-sm-2 control-label">Поиск</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Поиск" ng-model="rossvyazOperatorSearchText">
            </div>
        </div>

        <table class="table table-striped table-hover table-condensed" ng-if="rossvyazOperatorSearchText">
            <tr ng-repeat="item in list | filter: rossvyazOperatorSearchText">
                <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
            </tr>
        </table>

    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Отмена</button>
        </div>
    </div>

</form>
