<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">Редактирование группы атрибутов {{item.name}}</h3>
        <h3 ng-if="!item.id">Создание группы атрибутов</h3>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label class="col-sm-2 control-label">Название</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Название" ng-model="item.name" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">Примечание</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Примечание" ng-model="item.note">
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="col-sm-2 control-label">Список атрибутов</label>
        <div class="col-sm-10">

            <table class="table table-striped">
                <tbody>
                <tr ng-repeat="line in item.attributeslist_ids">
                    <td width="100%">
                        <select-box list="attribute" model="line.id" placeholder="Выберите атрибут"
                                    required="true"></select-box>
                    </td>
                    <td>
                        <button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus"
                                ng-click="removeAttribute($index)"></button>
                    </td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <td colspan="3">
                        <button type="button" class="btn btn-success btn-xs" ng-click="addAttribute()"><i
                                class="glyphicon glyphicon-plus"></i>Добавить атрибут
                        </button>
                    </td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid || $root.isAjaxLoading" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
            <action-log-view-button ng-if="item.id && userPermissions['action_log_view']" key="{{item.id}}" type="json/attribute-group"></action-log-view-button>
        </div>
    </div>

</form>
