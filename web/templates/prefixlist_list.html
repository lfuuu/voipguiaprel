<div ng-if="userPermissions['prefixlist_create']">
    <a class="btn btn-primary btn-sm pull-right"  ng-click="clickCreate()">Создать</a>
</div>
<h4>Списки префиксов</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed" >
    <thead>
    <tr>
        <th width="1%"></th>
        <th>
            <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                Название
                <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th>
            <a href="#" ng-click="sortType = 'type_id'; sortReverse = !sortReverse">
                Тип
                <span ng-show="sortType == 'type_id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'type_id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th>
            <a href="#" ng-click="sortType = 'dt_update'; sortReverse = !sortReverse">
                Дата обновления
                <span ng-show="sortType == 'dt_update' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'dt_update' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th>Флаги</th>
        <th width="10%">
            <a href="#" ng-click="sortType = 'server_id'; sortReverse = !sortReverse">
                Сервер
                <span ng-show="sortType == 'server_id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'server_id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th ng-if="userPermissions['prefixlist_delete']" width="1%">&nbsp;</th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list | orderBy:sortType:sortReverse | prefixlistFilter:searchQuery:filterFields">
        <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>
            <img ng-if="item.dt_prepare" src="../img/not_executed.png">
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <span ng-if="item.type_id == 1">Вручную</span>
            <span ng-if="item.type_id == 2">Местные префиксы</span>
            <span ng-if="item.type_id == 3">РосСвязь</span>
            <span ng-if="item.type_id == 4">CSV</span>
            <span ng-if="item.type_id == 5">Дорогие коды</span>
            <span ng-if="item.type_id == 6">NNP</span>
            <span ng-if="item.type_id == 7">7800</span>
            <span ng-if="item.type_id == 8">Did на ВАТС</span>
            <span ng-if="item.type_id == 9">FMC</span>
            <span ng-if="item.type_id == 10">Parted num</span>
            <span ng-if="item.type_id == 11">Роуминг</span>
            <span ng-if="item.type_id == 12">Реестр номеров</span>
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.dt_update}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <span class="label label-warning" ng-if="item.sw_shared">ОБЩИЙ</span>
            <span class="label label-success" ng-if="item.is_global">Глобальный</span>
            <span class="label label-danger" ng-if="item.is_auto_update">Автообновление</span>
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.server_id}}</td>
        <td ng-if="userPermissions['prefixlist_delete']"><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-disabled="item.server_id != server.id" ng-click="deleteItem(item)"></button></td>
    </tr>

</tbody>
</table>
