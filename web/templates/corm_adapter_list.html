<div ng-if="userPermissions['corm_edit']">
    <a class="btn btn-primary btn-sm pull-right" ng-click="clickCreate()">Создать</a>
</div>
<h4>Сорм адаптеры(приёмники телеметрии)</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed">
    <thead>
    <tr>
        <th width="5%">
            <a href="#" ng-click="sortType = 'id'; sortReverse = !sortReverse">
                ID
                <span ng-show="sortType == 'id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="100%">
            <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                Название
                <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th>&nbsp;</th>
        <th ng-if="userPermissions['corm_edit']">&nbsp;</th>
    </tr>
    </thead>
    <tbody>
    <tr ng-repeat="item in list | orderBy:sortType:sortReverse | basicFilter:searchQuery:filterFields">
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
        <td>
            <comment-icon ng-if="item.id" key="{{item.id}}" type="adapter" comment="item.object_comment"></comment-icon>
        </td>
        <td ng-if="userPermissions['corm_edit']">
            <button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button>
        </td>
    </tr>
    </tbody>
</table>
