<div>
    <a ng-if="userPermissions['test_pricelist_create']" class="btn btn-primary search-form-button" ng-click="clickCreate()">Создать</a>
    <button type="submit" class="btn btn-success search-form-button" ng-click="clickSearch()">Поиск</button>
    <button type="submit" ng-hide="hideFilter" class="btn btn-warning search-form-button" ng-click="hideFilter = true">Скрыть фильтр</button>
    <button type="submit" ng-hide="!hideFilter" class="btn btn-info search-form-button" ng-click="hideFilter = false">Показать фильтр</button>
</div>
<h4>Тестирование прайслистов</h4>

<form ng-hide="hideFilter">
    <div class="form-group">
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
                <label class="col-sm-2 search-field-label">ID</label>
                <div class="col-sm-10 search-input">
                    <input type="text" class="form-control" placeholder="Поиск" ng-model="searchArray.id" ng-keydown="$event.keyCode === 13 && refreshList()">
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Группа</label>
                <div class="col-sm-10 search-input">
                    <select class="search-form-select" ui-select2 style="width: 100%" tags="true" placeholder="Группа" ng-model="searchArray.group_id" ng-change="refreshList()" required>
                        <option value="">-- Выберите группу --</option>
                        <option ng-repeat="group in testGroupList" value="{{group.id}}">{{group.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Результат</label>
                <div class="col-sm-10 search-input">
                    <select class="search-form-select" ui-select2 style="width: 100%" placeholder="Результат" ng-model="searchArray.result" ng-change="refreshList()" required>
                        <option value="">Все тесты</option>
                        <option ng-repeat="result in testResultList" value="{{result.id}}">{{result.name}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
                <label class="col-sm-2 search-field-label">Название</label>
                <div class="col-sm-10 search-input">
                    <input type="text" class="form-control" placeholder="Поиск" ng-model="searchArray.name" ng-keydown="$event.keyCode === 13 && refreshList()">
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Сервер</label>
                <div class="col-sm-10 search-input">
                    <select class="search-form-select" ui-select2 style="width: 100%" tags="true" placeholder="Сервер" ng-model="searchArray.server_id" ng-change="refreshList()" required>
                        <option value="">-- Выберите сервер --</option>
                        <option ng-repeat="server in serverList" value="{{server.id}}">{{server.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Прайслист</label>
                <div class="col-sm-10 search-input">
                    <select class="search-form-select" ui-select2 style="width: 100%" tags="true" placeholder="Прайслист" ng-model="searchArray.pricelist_id" ng-change="refreshList()" required>
                        <option value="">-- Выберите прайслист --</option>
                        <option ng-repeat="pricelist in pricelistList" value="{{pricelist.id}}">{{pricelist.name}}</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</form>

<div>
    <pagination style="display: inline;" total-items="totalItems" max-size="10" previous-text="Предыдущие" next-text="Следующие" first-text="В начало" last-text="В конец" boundary-links="true" items-per-page="limit" page="currentPage" on-select-page="setPagingData(page)"></pagination>
</div>

<table class="table table-striped table-hover table-condensed" >
    <thead>
        <tr>
            <th width="5%">
                <a href="#" ng-click="sortType = 'id'; sortReverse = !sortReverse">
                    ID
                    <span ng-show="sortType == 'id' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'id' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="1%"> </th>
            <th width="15%">
                <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                    Название
                    <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="5%"></th>
            <th width="15%">
                <a href="#" ng-click="sortType = 'server_name'; sortReverse = !sortReverse">
                    Сервер
                    <span ng-show="sortType == 'server_name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'server_name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'pricelist_name'; sortReverse = !sortReverse">
                    Прайслист
                    <span ng-show="sortType == 'pricelist_name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'pricelist_name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="5%"></th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'a_number'; sortReverse = !sortReverse">
                    Номер А
                    <span ng-show="sortType == 'a_number' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'a_number' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'b_number'; sortReverse = !sortReverse">
                    Номер B
                    <span ng-show="sortType == 'b_number' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'b_number' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="15%">
                <a href="#" ng-click="sortType = 'location_name'; sortReverse = !sortReverse">
                    Местоположение
                    <span ng-show="sortType == 'location_name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'location_name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="15%">
                <a href="#" ng-click="sortType = 'mcc'; sortReverse = !sortReverse">
                    MCC
                    <span ng-show="sortType == 'mcc' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'mcc' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="15%">
                <a href="#" ng-click="sortType = 'mnc'; sortReverse = !sortReverse">
                    MNC
                    <span ng-show="sortType == 'mnc' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'mnc' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="1" ng-if="userPermissions['test_pricelist_create']">&nbsp;</th>
            <th width="1" ng-if="userPermissions['test_pricelist_delete']">&nbsp;</th>
        </tr>
    </thead>
    <tbody>

        <tr ng-repeat="item in list | orderBy:sortType:sortReverse | basicFilter:searchQuery:filterFields">
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.id}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>
                <img ng-if="item.is_autotest" src="../img/{{item.result}}.png">
            </td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.name}}</td>
            <td><button type="button" class="btn btn-default btn-sm" ng-click="showTestPrimary(item)">MAIN</button></td>
            <td><button type="button" class="btn btn-default btn-sm" ng-click="showTestDev(item)">Dev</button></td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.server_name}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.pricelist_name}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">
                <span class="label label-success" ng-if="item.is_orig">ORIG</span>
                <span class="label label-danger" ng-if="!item.is_orig">TERM</span>
            </td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.a_number}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.b_number}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.location_name}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.mcc_name}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.mnc_name}}</td>
            <td ng-if="userPermissions['test_pricelist_create']"><button type="button" class="btn btn-default btn-sm" ng-click="cloneTest(item)">Клонировать</button></td>
            <td ng-if="userPermissions['test_pricelist_delete']"><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button></td>
        </tr>

    </tbody>
</table>
