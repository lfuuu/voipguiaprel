<div class="wrap">
  <!-- Левая колонка со списком табов -->
  <div style="position: fixed; left: 15px; bottom: 0; top: 60px; width: 230px; overflow-y: auto">
    <div class="list-group">
      <a class="list-group-item"
         ng-click="Redirect.billingServersList()"
         ng-class="{active: tabs.isController('BillingServersListCtrl')}">
        Список серверов
      </a>
      <a class="list-group-item"
         ng-click="Redirect.billingServerCreate()"
         ng-class="{active: tabs.isController('BillingServerCreateCtrl')}">
        Добавить сервер
      </a>
    </div>
  </div>

  <!-- Правая область — контент табов -->
  <div style="position: fixed; overflow: auto;
              bottom: 0; right: 0; top: 60px;
              padding-left: 20px; padding-right: 20px;
              left: 250px;">
    <tabset class="main-tabs"
            ng-show="tabs.length > 0"
            vertical="true"
            type="'pills'">
      <tab ng-repeat="tab in tabs"
           active="tab.active"
           ng-controller="tab.controller">
        <ng-include src="tab.template"
                    onload="init(tab)"></ng-include>
      </tab>
    </tabset>
  </div>
</div>

<!-- Попап ошибок -->
<div id="popup-alert"
     class="alert alert-danger"
     style="cursor: pointer;
            position: absolute;
            left: 20%; right: 20%;
            top: 45px;
            z-index: 5000;"
     ng-if="popupErrors"
     ng-click="closeErrorsPopup()">
  <button type="button"
          class="close"
          ng-click="closeErrorsPopup()">
    <span aria-hidden="true">×</span>
  </button>
  <h4 ng-if="popupErrors.header">{{popupErrors.header}}</h4>
  <p ng-repeat="error in popupErrors.errors">{{error}}</p>
</div>
