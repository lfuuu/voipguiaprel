<div class="modal-header">
    <h3>Calls Raw {{item.id}}</h3>
</div>
<div class="modal-body">
    <table class="table table-striped table-hover table-condensed" >
        <thead>
        <tr>
            <th width="5%">
                ЛС
            </th>
            <th width="5%">
                Trunk service
            </th>
            <th width="5%">
                Number service
            </th>
            <th width="5%">
                SRC number
            </th>
            <th width="5%">
                DST number
            </th>
            <th width="5%">
                Billed time
            </th>
            <th width="5%">
                Rate
            </th>
            <th width="5%">
                Cost
            </th>
        </tr>
        </thead>
        <tbody>

        <tr>
            <td>{{item.account_id}}</td>
            <td>{{item.trunk_service_id}}</td>
            <td>{{item.number_service_id}}</td>
            <td>{{item.src_number}}</td>
            <td>{{item.dst_number}}</td>
            <td>{{item.billed_time}}</td>
            <td>{{item.rate}}</td>
            <td>{{item.cost}}</td>
        </tr>

        </tbody>
    </table>
</div>
<div class="modal-footer">
    <div class="pull-left">
        <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
    </div>
</div>
