<form class="form-horizontal" name="form">
    <div class="modal-header">
        <h3>История</h3>
    </div>
    <div class="modal-body">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th class="col-sm-2">Альфа номер</th>
                    <th class="col-sm-2">ID</th>
                    <th class="col-sm-2">Тип изменения</th>
                </tr>
            </thead>
            <tr ng-repeat="val in list">
                <td>{{val.alphanum}}</td>
                <td><span style="cursor: pointer">#{{val.a2p_alphanum_history_id}}</span></td>
                <td style="{{styleMap[val.type]}}">{{map[val.type]}}</td>
            </tr>
        </table>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
