<h4>
    Поиск в прайслистах
    <button type="submit" class="btn btn-success search-form-button" ng-click="clickSearch()">Поиск</button>
    <button type="submit" ng-hide="hideFilter" class="btn btn-warning search-form-button" ng-click="hideFilter = true">Скрыть фильтр</button>
    <button type="submit" ng-hide="!hideFilter" class="btn btn-info search-form-button" ng-click="hideFilter = false">Показать фильтр</button>
</h4>

<form ng-hide="hideFilter">
    <div class="form-group">
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
                <label class="col-sm-2 search-field-label">Время</label>
                <div class="col-sm-10 search-input">
                    <input class="form-control" placeholder="now()" ng-model="item.timestamp">
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Номер А</label>
                <div class="col-sm-10 search-input">
                    <input class="form-control" placeholder="79587980123" ng-model="item.number_a">
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Номер B</label>
                <div class="col-sm-10 search-input">
                    <input class="form-control" placeholder="79587980123" ng-model="item.number_b">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
                <label class="col-sm-2 search-field-label">MCC</label>
                <div class="col-sm-10 search-input">
                    <input class="form-control" placeholder="123" ng-model="item.mcc">
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Страна A</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.a_country_id" style="width: 100%" >
                        <option ng-repeat="country in countryListA" value="{{::country.code}}">{{::country.name_rus}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Страна B</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.b_country_id" style="width: 100%" >
                        <option ng-repeat="country in countryListB" value="{{::country.code}}">{{::country.name_rus}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
                <label class="col-sm-2 search-field-label">MNC</label>
                <div class="col-sm-10 search-input">
                    <input class="form-control" placeholder="45" ng-model="item.mnc">
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Регион A</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.a_region_id" style="width: 100%" >
                        <option ng-repeat="region in regionListA" value="{{::region.id}}">{{::region.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Регион B</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.b_region_id" style="width: 100%" >
                        <option ng-repeat="region in regionListB" value="{{::region.id}}">{{::region.name}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
                <label class="col-sm-2 search-field-label">Location</label>
                <div class="col-sm-10 search-input">
                    <select class="search-form-select" ui-select2 style="width: 100%" tags="true" ng-model="item.location_id" placeholder="Местоположение">
                        <option value="">-- Выберите --</option>
                        <option ng-repeat="location in locationList" value="{{location.id}}">{{location.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Город A</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.a_city_id" style="width: 100%" >
                        <option ng-repeat="city in cityListA" value="{{::city.id}}">{{::city.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Город B</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.b_city_id" style="width: 100%" >
                        <option ng-repeat="city in cityListB" value="{{::city.id}}">{{::city.name}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">

            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Оператор A</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.a_operator_id" style="width: 100%" >
                        <option ng-repeat="operator in operatorListA" value="{{::operator.id}}">{{::operator.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Оператор B</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.b_operator_id" style="width: 100%" >
                        <option ng-repeat="operator in operatorListB" value="{{::operator.id}}">{{::operator.name}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">

            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Тип NDC A</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.a_ndc_id" style="width: 100%" >
                        <option ng-repeat="ndcType in ndcTypeList" value="{{::ndcType.id}}">{{::ndcType.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Тип NDC B</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.b_ndc_id" style="width: 100%" >
                        <option ng-repeat="ndcType in ndcTypeList" value="{{::ndcType.id}}">{{::ndcType.name}}</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</form>

<div ng-hide="!isLoading" class="row">
    <div class="form-group col-sm-12" style="text-align: center;">
        Идет загрузка данных...
    </div>
</div>

<div ng-hide="!noData" class="row">
    <div class="form-group col-sm-12" style="text-align: center;">
        Нет данных.
    </div>
</div>

<table ng-hide="noData" class="table table-striped table-hover table-condensed" >
    <thead>
    <tr>
        <th width="5%">
            <a href="#" ng-click="sortType = 'connect_time'; sortReverse = !sortReverse">
                Прайслист
                <span ng-show="sortType == 'connect_time' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'connect_time' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'server_id'; sortReverse = !sortReverse">
                Местоположение
                <span ng-show="sortType == 'server_id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'server_id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'src_route'; sortReverse = !sortReverse">
                Фильтр А
                <span ng-show="sortType == 'src_route' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'src_route' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'dst_route'; sortReverse = !sortReverse">
                Фильтр В
                <span ng-show="sortType == 'dst_route' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'dst_route' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'src_number'; sortReverse = !sortReverse">
                Префикс прайса
                <span ng-show="sortType == 'src_number' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'src_number' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list | orderBy:sortType:sortReverse">
        <td style="cursor: pointer" ng-click="clickPricelist(item)">{{item.pricelist_id}}{{item.pricelist_name ? ': ' + item.pricelist_name : ''}}</td>
        <td style="cursor: pointer" ng-click="clickLocation(item)">{{item.location_id}}</td>
        <td style="cursor: pointer" ng-click="clickFilterA(item)">{{item.filter_a}}</td>
        <td style="cursor: pointer" ng-click="clickFilterA(item)">{{item.filter_b}}</td>
        <td style="cursor: pointer" ng-click="clickPrefixPrice(item)">{{item.prefix}}</td>
    </tr>

    </tbody>
</table>
