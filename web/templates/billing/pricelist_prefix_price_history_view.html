<form class="form-horizontal" name="form">
    <div class="modal-header">
        <h3>История</h3>
    </div>
    <div class="modal-body">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th class="col-sm-2">Код</th>
                    <th class="col-sm-2">Цена старая</th>
                    <th class="col-sm-2">Цена новая</th>
                    <th class="col-sm-2">Дата начала действия</th>
                    <th class="col-sm-2">Дата окончания действия</th>
                    <th class="col-sm-2">Тип изменения</th>
                </tr>
            </thead>
            <tr ng-repeat="val in list">
                <td>{{val.prefix_b}}</td>
                <td>{{val.price_old}}</td>
                <td>{{val.price_new}}</td>
                <td>{{val.date_from}}</td>
                <td>{{val.date_to}}</td>
                <td style="{{styleMap[val.type]}}">{{map[val.type]}}</td>
            </tr>
        </table>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
