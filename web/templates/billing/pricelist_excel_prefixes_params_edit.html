<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3>Выберите параметры для выгрузки</h3>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label class="col-sm-2 control-label">Использовать минимизацию</label>
            <div class="col-sm-1">
                <div class="btn-group" ng-click="item.minimize = !item.minimize">
                    <button type="button" class="btn btn-sm {{item.minimize ? 'btn-success active' : 'btn-default'}}">Да</button>
                    <button type="button" class="btn btn-sm {{!item.minimize ? 'btn-primary active' : 'btn-default'}}">Нет</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Использовать диапазоны</label>
            <div class="col-sm-1">
                <div class="btn-group" ng-click="item.use_ranges = !item.use_ranges">
                    <button type="button" class="btn btn-sm {{item.use_ranges ? 'btn-success active' : 'btn-default'}}">Да</button>
                    <button type="button" class="btn btn-sm {{!item.use_ranges ? 'btn-primary active' : 'btn-default'}}">Нет</button>
                </div>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-click="save()">Выгрузить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
