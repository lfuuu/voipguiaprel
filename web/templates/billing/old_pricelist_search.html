<h4>
    Поиск в прайслистах v1
    <button type="submit" class="btn btn-success search-form-button" ng-click="clickSearch()">Поиск</button>
    <button type="submit" ng-hide="hideFilter" class="btn btn-warning search-form-button" ng-click="hideFilter = true">Скрыть фильтр</button>
    <button type="submit" ng-hide="!hideFilter" class="btn btn-info search-form-button" ng-click="hideFilter = false">Показать фильтр</button>
</h4>

<form ng-hide="hideFilter">
    <div class="form-group">
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
                <label class="col-sm-2 search-field-label">Префикс</label>
                <div class="col-sm-10 search-input">
                    <input class="form-control" placeholder="7958" ng-model="item.prefix">
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Страна</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.country_code" style="width: 100%" >
                        <option value="">-- Выберите --</option>
                        <option ng-repeat="country in countryList" value="{{::country.code}}">{{::country.name_rus}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Прайслист</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="item.pricelist_ids" style="width: 100%" >
                        <option value="">-- Выберите --</option>
                        <option ng-repeat="pricelist in pricelistList" value="{{::pricelist.id}}">{{::pricelist.name}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
                <label class="col-sm-1 search-field-label">Соответствие</label>
                <div class="col-sm-5 search-input">
                    <div class="btn-group">
                        <button type="button" class="btn {{item.exact_match ? 'btn-primary active' : 'btn-default'}}" ng-click="item.exact_match = true">Точное</button>
                        <button type="button" class="btn {{!item.exact_match ? 'btn-danger active' : 'btn-default'}}" ng-click="item.exact_match = false">Не точное</button>
                    </div>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">

            </div>
            <div class="form-group col-sm-4 search-form-item">

            </div>
        </div>
    </div>
</form>

<div ng-hide="!isLoading" class="row">
    <div class="form-group col-sm-12" style="text-align: center;">
        Идет загрузка данных...
    </div>
</div>

<div ng-hide="!noData" class="row">
    <div class="form-group col-sm-12" style="text-align: center;">
        Нет данных.
    </div>
</div>

<table ng-hide="noData" class="table table-striped table-hover table-condensed" >
    <thead>
    <tr>
        <th width="5%">
            <a href="#" ng-click="sortType = 'connect_time'; sortReverse = !sortReverse">
                Оператор
                <span ng-show="sortType == 'connect_time' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'connect_time' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'server_id'; sortReverse = !sortReverse">
                Валюта
                <span ng-show="sortType == 'server_id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'server_id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'src_route'; sortReverse = !sortReverse">
                Префикс
                <span ng-show="sortType == 'src_route' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'src_route' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'dst_route'; sortReverse = !sortReverse">
                Цена
                <span ng-show="sortType == 'dst_route' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'dst_route' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'src_number'; sortReverse = !sortReverse">
                Прайслист
                <span ng-show="sortType == 'src_number' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'src_number' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list | orderBy:sortType:sortReverse">
        <td style="cursor: pointer" ng-click="clickAccount(item)"><a target="_blank" href="https://stat.mcn.ru/client/view?id={{item.account_id}}">{{item.account_id}}</a></td>
        <td style="cursor: pointer">{{item.currency}}</td>
        <td style="cursor: pointer">{{item.prefix}}</td>
        <td style="cursor: pointer">{{item.price}}</td>
        <td style="cursor: pointer"><a target="_blank" href="https://stat.mcn.ru/voip/pricelist/edit?id={{item.pricelist_id}}">{{item.pricelist_id}}</a></td>
    </tr>

    </tbody>
</table>
