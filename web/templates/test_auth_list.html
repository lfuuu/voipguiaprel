<div>
    <a class="btn btn-primary btn-sm pull-right" ng-click="clickCreate()">Создать</a>
    <h4>Тестирование маршрутизации</h4>
</div>

<table class="table table-striped table-hover table-condensed" >
    <thead>
    <tr>
        <th width="10%">Название</th>
        <th width="1%"></th>
        <th width="1%"></th>
        <th width="20%">Транк</th>
        <th width="20%">Номер A</th>
        <th width="20%">Номер B</th>
        <th width="20%">Номер Redirect</th>
        <th>&nbsp;</th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list">
        <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.name}}</td>
        <td><button type="button" class="btn btn-default btn-sm" ng-click="showTestItem(item)">Показать Тест</button></td>
        <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.trunk_name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.src_number}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.dst_number}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.redirect_number}}</td>
        <td><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button></td>
    </tr>

    </tbody>
</table>
