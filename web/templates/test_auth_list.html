<div>
    <a ng-if="userPermissions['test_auth_create']" class="btn btn-primary btn-sm pull-right" ng-click="clickCreate()">Создать</a>
</div>
<h4>Тестирование маршрутизации</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
            <div class="row">
                <div class="form-group col-sm-6">
                    <select ui-select2 style="width: 100%" tags="true" ng-change="testGroupChanged(testGroupId)" placeholder="Группа" ng-model="testGroupId" required>
                        <option value="undefined">-- Выберите группу теста --</option>
                        <option ng-repeat="group in testGroupList" value="{{group.id}}">{{group.name}}</option>
                    </select>
                </div>
                <div class="form-group col-sm-6">
                    <select ui-select2 style="width: 100%" tags="true" ng-change="testResultChanged(testResult)" placeholder="Результат" ng-model="testResult" required>
                        <option value="undefined">Все тесты</option>
                        <option ng-repeat="result in testResultList" value="{{result.id}}">{{result.name}}</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</form>

<div>
    <pagination style="display: inline;" total-items="totalItems" items-per-page="limit" page="currentPage" on-select-page="setPagingData(page)"></pagination>
    <button style="display: inline; margin-left: 10px;" class="btn btn-info" ng-click="runAll()">Запустить все</button>
    <button ng-if="userPermissions['test_auth_edit']" style="display: inline; margin-left: 10px;" class="btn btn-info" ng-click="clearCache()">Очистить кэш</button>
    <button ng-if="testGroupId == TEST_GROUP_AUTOMATIC && userPermissions['auto_test_management']" style="display: inline; margin-left: 10px;" class="btn btn-success" ng-click="generateTests()">Создать тесты</button>
    <button ng-if="testGroupId == TEST_GROUP_AUTOMATIC && userPermissions['auto_test_management']" style="display: inline; margin-left: 10px;" class="btn btn-danger" ng-click="deleteTests()">Удалить тесты</button>
    <button ng-if="testGroupId == TEST_GROUP_AUTOMATIC && userPermissions['auto_test_management']" style="display: inline; margin-left: 10px;" class="btn btn-warning" ng-click="viewTestsLog()">Открыть лог</button>
</div>

<table class="table table-striped table-hover table-condensed" >
    <thead>
        <tr>
            <th width="5%">
                <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                    ID
                    <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="1%"> </th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                    Название
                    <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="20%"></th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'trunk_name'; sortReverse = !sortReverse">
                    Транк
                    <span ng-show="sortType == 'trunk_name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'trunk_name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'src_number'; sortReverse = !sortReverse">
                    Номер A
                    <span ng-show="sortType == 'src_number' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'src_number' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'dst_number'; sortReverse = !sortReverse">
                    Номер B
                    <span ng-show="sortType == 'dst_number' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'dst_number' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="15%">
                <a href="#" ng-click="sortType = 'redirect_number'; sortReverse = !sortReverse">
                    Номер Redirect
                    <span ng-show="sortType == 'redirect_number' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'redirect_number' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="15%">
                <a href="#" ng-click="sortType = 'redirect_number'; sortReverse = !sortReverse">
                    CPC
                    <span ng-show="sortType == 'redirect_number' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'redirect_number' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th ng-hide="!displayOnlineResult" width="5%">
                <a href="#" ng-click="sortType = 'redirect_number'; sortReverse = !sortReverse">
                    Результат
                    <span ng-show="sortType == 'redirect_number' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'redirect_number' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="1%">&nbsp;</th>
            <th ng-if="userPermissions['test_auth_create']" width="1%">&nbsp;</th>
            <th ng-if="userPermissions['test_auth_delete']">&nbsp;</th>
        </tr>
    </thead>
    <tbody>

        <tr ng-repeat="item in list | orderBy:sortType:sortReverse | basicFilter:searchQuery:filterFields">
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.id}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>
                <img ng-if="item.is_autotest" src="../img/{{item.result}}.png">
            </td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.name}}</td>
            <td>
                <button type="button" class="btn btn-default btn-sm" ng-click="showTestPrimary(item)">MAIN</button>
                <button type="button" class="btn btn-default btn-sm" ng-click="showTestReserve(item)">RES</button>
                <button type="button" class="btn btn-default btn-sm" ng-click="showTestReserve2(item)">RES2</button>
                <button type="button" class="btn btn-default btn-sm" ng-click="showTestDev(item)">DEV</button>
            </td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.trunk_name}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.src_number}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.dst_number}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.redirect_number}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.cpc}}</td>
            <td ng-hide="!displayOnlineResult" style="cursor: pointer" ng-click="clickItem(item)" nowrap>{{item.result_online}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">
                <span class="label label-success" ng-if="item.is_autotest">AUTO</span>
            </td>
            <td ng-if="userPermissions['test_auth_create']"><button type="button" class="btn btn-default btn-sm" ng-click="cloneTest(item)">Клонировать</button></td>
            <td ng-if="userPermissions['test_auth_delete']"><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button></td>
        </tr>

    </tbody>
</table>
