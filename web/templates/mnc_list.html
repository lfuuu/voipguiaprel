<div ng-if="userPermissions['mnc_create']">
    <a class="btn btn-primary btn-sm pull-right" ng-click="clickCreate()">Создать</a>
</div>
<h4>MNC</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed" >
    <thead>
    <tr>
        <th width="10%">
            <a href="#" ng-click="sortType = 'mnc'; sortReverse = !sortReverse">
                MNC
                <span ng-show="sortType == 'mnc' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'mnc' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="89%">
            <a href="#" ng-click="sortType = 'network'; sortReverse = !sortReverse">
                Сеть
                <span ng-show="sortType == 'network' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'network' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th ng-if="userPermissions['mnc_delete']">&nbsp;</th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list | orderBy:sortType:sortReverse | basicFilter:searchQuery:filterFields">
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.mnc}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.network}}</td>
        <td ng-if="userPermissions['mnc_delete']"><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button></td>
    </tr>

    </tbody>
</table>
