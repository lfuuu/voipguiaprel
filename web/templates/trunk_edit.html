<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">Транк {{item.name}} (#{{item.id}})</h3>
        <h3 ng-if="!item.id">Создание транка</h3>
    </div>

    <div class="modal-body"  >

        <!-- Nav tabs -->
        <ul class="nav nav-tabs">
            <li class="active"><a class="trunk-header" href="#trunk" data-toggle="tab">Транк</a></li>
            <li><a class="trunk-header" href="#trunk_extra" data-toggle="tab">Доп.</a></li>
            <li><a class="trunk-header" href="#priority" data-toggle="tab">Приоритеты</a></li>

            <li><a class="trunk-header" href="#numbers_rules_orig_a" data-toggle="tab">Пр. Orig A</a></li>
            <li><a class="trunk-header" href="#numbers_rules_orig_b" data-toggle="tab">Пр. Orig B</a></li>
            <li><a class="trunk-header" href="#numbers_rules_orig_c" data-toggle="tab">Пр. Orig C</a></li>
            <li><a class="trunk-header" href="#numbers_rules_term_a" data-toggle="tab">Пр. Term A</a></li>
            <li><a class="trunk-header" href="#numbers_rules_term_b" data-toggle="tab">Пр. Term B</a></li>
            <li><a class="trunk-header" href="#numbers_rules_term_c" data-toggle="tab">Пр. Term C</a></li>

            <li><a class="trunk-header" href="#trunk_rules" data-toggle="tab">Правила</a></li>
            <li><a class="trunk-header" href="#trunk_route_num" data-toggle="tab">Пр. Routing Num</a></li>
            <li><a class="trunk-header" href="#number_preprocessing" data-toggle="tab">Препроцессинг</a></li>
            <li><a class="trunk-header" href="#sorm_edit" data-toggle="tab">ПП-538</a></li>
            <li><a class="trunk-header" href="#load_limit" data-toggle="tab">Огр. загрузки</a></li>
            <li><a class="trunk-header" href="#usage_in_trunk_groups" data-toggle="tab">Группы</a></li>
            <li><a class="trunk-header" href="#object_comment" data-toggle="tab">Комментарий</a></li>
        </ul>

        <br />

        <!-- Tab panes -->
        <div class="tab-content">
            <div class="tab-pane active" id="trunk" ng-include="'/templates/tabs/trunk_edit/trunk.html'"></div>
            <div class="tab-pane" id="trunk_extra" ng-include="'/templates/tabs/trunk_edit/trunk_extra.html'"></div>

            <div class="tab-pane" id="priority" ng-include="'/templates/tabs/trunk_edit/priority.html'"></div>

            <div class="tab-pane" id="numbers_rules_orig_a" ng-include="'/templates/tabs/trunk_edit/numbers_rules.html'" ng-if="true" onload="mode = transcriptMode('orig-a')"></div>
            <div class="tab-pane" id="numbers_rules_orig_b" ng-include="'/templates/tabs/trunk_edit/numbers_rules.html'" ng-if="true" onload="mode = transcriptMode('orig-b')"></div>
            <div class="tab-pane" id="numbers_rules_orig_c" ng-include="'/templates/tabs/trunk_edit/numbers_rules.html'" ng-if="true" onload="mode = transcriptMode('orig-c')"></div>
            <div class="tab-pane" id="numbers_rules_term_a" ng-include="'/templates/tabs/trunk_edit/numbers_rules.html'" ng-if="true" onload="mode = transcriptMode('term-a')"></div>
            <div class="tab-pane" id="numbers_rules_term_b" ng-include="'/templates/tabs/trunk_edit/numbers_rules.html'" ng-if="true" onload="mode = transcriptMode('term-b')"></div>
            <div class="tab-pane" id="numbers_rules_term_c" ng-include="'/templates/tabs/trunk_edit/numbers_rules.html'" ng-if="true" onload="mode = transcriptMode('term-c')"></div>

            <div class="tab-pane" id="trunk_rules" ng-include="'/templates/tabs/trunk_edit/trunk_rules.html'"></div>
            <div class="tab-pane" id="trunk_route_num" ng-include="'/templates/tabs/trunk_edit/trunk_route_num.html'"></div>

            <div class="tab-pane" id="number_preprocessing" ng-include="'/templates/tabs/trunk_edit/number_preprocessing.html'"></div>
            <div class="tab-pane" id="sorm_edit" ng-include="'/templates/tabs/trunk_edit/sorm_edit.html'"></div>
            <div class="tab-pane" id="load_limit" ng-include="'/templates/tabs/trunk_edit/load_limit.html'"></div>
            <div class="tab-pane" id="usage_in_trunk_groups" ng-include="'/templates/tabs/trunk_edit/usage_in_trunk_groups.html'"></div>
            <div class="tab-pane" id="object_comment" ng-include="'/templates/tabs/shared_tabs/comment.html'"></div>
        </div>
    </div>

    <div class="modal-footer" >
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid || $root.isAjaxLoading" ng-if="userPermissions['trunk_edit']"  ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
            <action-log-view-button ng-if="item.id && userPermissions['action_log_view']" key="{{item.id}}" type="json/trunk"></action-log-view-button>
        </div>
        <div class="pull-right">
            <button type="button" class="btn btn-primary btn-sm" ng-click="openServiceTrunks(item)">Логические транки</button>
        </div>
    </div>

</form>
