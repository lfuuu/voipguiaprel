<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">Аплинк {{item.name}}</h3>
        <h3 ng-if="!item.id">Создание аплинка</h3>
    </div>
    <div class="modal-body">

        <ul class="nav nav-tabs">
            <li class="active"><a href="#number-tab" data-toggle="tab">Настройки</a></li>
        </ul>

        <br/>

        <div class="tab-content">
            <div class="tab-pane active" id="number-tab">

                <div class="form-group">
                    <label class="col-sm-2 control-label">Хаб</label>
                    <div class="col-sm-10">
                        <select-box disabled="{{item.id}}" list="hub" model="item.hub_id" placeholder="Хаб не выбран" required></select-box>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Регион</label>
                    <div class="col-sm-10">
                        <select ng-disabled="item.id" ui-select2 ng-model="item.region_id" placeholder="Выберите регион" style="width: 100%" >
                            <option ng-repeat="region in regionList" value="{{region.id}}">{{region.name}}</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Физический транк</label>
                    <div class="col-sm-10">
                        <select ng-disabled="item.id" ui-select2 ng-model="item.p_trunk_id" placeholder="Выберите транк" style="width: 100%" >
                            <option ng-repeat="pTrunk in pTrunkList" value="{{pTrunk.id}}">{{pTrunk.trunk_name}}</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Логический транк</label>
                    <div class="col-sm-10">
                        <select ng-disabled="item.id" ui-select2 ng-model="item.l_trunk_id" placeholder="Выберите транк" style="width: 100%" >
                            <option ng-repeat="lTrunk in lTrunkList" value="{{lTrunk.id}}">{{lTrunk.id}}</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Включено</label>
                    <div class="col-sm-10">
                        <div class="btn-group" ng-click="item.active = !item.active">
                            <button type="button" class="btn btn-sm {{item.active ? 'btn-success active' : 'btn-default'}}">Вкл</button>
                            <button type="button" class="btn btn-sm {{!item.active ? 'btn-primary active' : 'btn-default'}}">Выкл</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Режим</label>
                    <div class="col-sm-10">
                        <select ui-select2 ng-model="item.active_mode" placeholder="Выберите режим" style="width: 100%" >
                            <option ng-repeat="aType in activeTypes" value="{{aType.id}}">{{aType.name}}</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Фильтр по регионам</label>
                    <div class="col-sm-10">
                        <input class="form-control" placeholder="Фильтр по регионам" ng-model="item.region_filter">
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
