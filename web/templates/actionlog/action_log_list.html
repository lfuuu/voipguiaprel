<h4>
    История изменений
    <button type="submit" class="btn btn-success search-form-button" ng-click="clickSearch()">Поиск</button>
    <button type="submit" ng-hide="hideFilter" class="btn btn-warning search-form-button" ng-click="hideFilter = true">Скрыть фильтр</button>
    <button type="submit" ng-hide="!hideFilter" class="btn btn-info search-form-button" ng-click="hideFilter = false">Показать фильтр</button>
</h4>

<form ng-hide="hideFilter">
    <div class="form-group">
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
                <label class="col-sm-2 search-field-label">Пользователь</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="searchArray.user_id" style="width: 100%" >
                        <option value="all">Все</option>
                        <option ng-repeat="user in userList" value="{{::user.id}}">{{::user.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Сущность</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="searchArray.controller" style="width: 100%" >
                        <option value="all">Все</option>
                        <option ng-repeat="controller in controllerList" value="{{::controller.id}}">{{::controller.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">Действие</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="searchArray.action" style="width: 100%" >
                        <option value="all">Все</option>
                        <option ng-repeat="action in actionList" value="{{::action.id}}">{{::action.name}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-sm-8" style="padding-right: 5px;">
                <div class="form-group col-sm-1" style="width: 50px; padding-left: 0px;">
                    <button class="dropdown-toggle btn btn-info" data-toggle="dropdown">
                        <span class="glyphicon glyphicon-time"></span>
                        <span class="glyphicon glyphicon-chevron-down"></span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a href="#" ng-click="searchArray.is_time_absolute = true">Absolute</a></li>
                        <li><a href="#" ng-click="searchArray.is_time_absolute = false">Relative</a></li>
                    </ul>
                </div>
                <div class="col-sm-1 search-input" ng-hide="!searchArray.is_time_absolute" style="width: 160px; padding-right: 5px; padding-left: 5px;">
                    <input class="form-control" ng-model="searchArray.time_from">
                </div>
                <div class="col-sm-1 search-input" ng-hide="!searchArray.is_time_absolute" style="width: 50px; padding-left: 0px; padding-right: 0px; text-align: center; line-height: 34px;">
                    <span>-- по --</span>
                </div>
                <div class="col-sm-1 search-input" ng-hide="!searchArray.is_time_absolute" style="width: 160px; padding-right: 5px; padding-left: 5px;">
                    <input class="form-control" ng-model="searchArray.time_to">
                </div>
                <div class="col-sm-1 search-input" ng-hide="searchArray.is_time_absolute" style="width: 370px; padding-right: 5px; padding-left: 5px;">
                    <select class="search-form-select" ui-select2 style="width: 100%" tags="true" ng-model="searchArray.time_relative">
                        <option value="">-- Выберите --</option>
                        <option ng-repeat="timeInterval in timeIntervals" value="{{timeInterval.id}}">{{timeInterval.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-1 search-field-label">Порядок</label>
                <div class="col-sm-5 search-input">
                    <div class="btn-group">
                        <button type="button" class="btn {{searchArray.sort_asc ? 'btn-primary active' : 'btn-default'}}" ng-click="searchArray.sort_asc = true">С начала</button>
                        <button type="button" class="btn {{!searchArray.sort_asc ? 'btn-danger active' : 'btn-default'}}" ng-click="searchArray.sort_asc = false">С конца</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>

<div>
    <pagination style="display: inline;" total-items="totalItems" max-size="10" previous-text="Предыдущие" next-text="Следующие" first-text="В начало" last-text="В конец" boundary-links="true" items-per-page="limit" page="currentPage" on-select-page="setPagingData(page)"></pagination>
</div>

<div ng-hide="!isLoading" class="row">
    <div class="form-group col-sm-12" style="text-align: center;">
        Идет загрузка данных...
    </div>
</div>

<div ng-hide="!noData" class="row">
    <div class="form-group col-sm-12" style="text-align: center;">
        Нет данных.
    </div>
</div>

<table ng-hide="noData" class="table table-striped table-hover table-condensed" >
    <thead>
    <tr>
        <th width="5%">
            <a href="#" ng-click="sortType = 'request_date'; sortReverse = !sortReverse">
                Дата
                <span ng-show="sortType == 'request_date' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'request_date' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'user_name'; sortReverse = !sortReverse">
                Пользователь
                <span ng-show="sortType == 'user_name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'user_name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'controller'; sortReverse = !sortReverse">
                Сущность
                <span ng-show="sortType == 'controller' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'controller' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'action'; sortReverse = !sortReverse">
                Действие
                <span ng-show="sortType == 'action' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'action' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'object_id'; sortReverse = !sortReverse">
                ID сущности
                <span ng-show="sortType == 'object_id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'object_id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list | orderBy:sortType:sortReverse">
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.request_date}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.user_name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.controller}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.action}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.object_id}}</td>
    </tr>

    </tbody>
</table>
