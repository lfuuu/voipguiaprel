<h4>
    История изменений
    <button type="submit" class="btn btn-success search-form-button" ng-click="clickSearch()">Поиск</button>
    <button type="submit" ng-hide="hideFilter" class="btn btn-warning search-form-button" ng-click="hideFilter = true">Скрыть фильтр</button>
    <button type="submit" ng-hide="!hideFilter" class="btn btn-info search-form-button" ng-click="hideFilter = false">Показать фильтр</button>
</h4>

<form ng-hide="hideFilter">
    <div class="form-group">
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
                <label class="col-sm-2 search-field-label">Пользователь</label>
                <div class="col-sm-10 search-input">
                    <select ui-select2 ng-model="searchArray.user_id" style="width: 100%" >
                        <option value="all">Все</option>
                        <option ng-repeat="user in userList" value="{{::user.id}}">{{::user.name}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group col-sm-4 search-form-item">
            </div>
            <div class="form-group col-sm-4 search-form-item">
            </div>
        </div>
        <div class="row">
            <div class="form-group col-sm-4 search-form-item first-form-item">
            </div>
            <div class="form-group col-sm-4 search-form-item">
            </div>
            <div class="form-group col-sm-4 search-form-item">
            </div>
        </div>
    </div>
</form>

<div>
    <pagination style="display: inline;" total-items="totalItems" max-size="10" previous-text="Предыдущие" next-text="Следующие" first-text="В начало" last-text="В конец" boundary-links="true" items-per-page="limit" page="currentPage" on-select-page="setPagingData(page)"></pagination>
</div>

<div ng-hide="!isLoading" class="row">
    <div class="form-group col-sm-12" style="text-align: center;">
        Идет загрузка данных...
    </div>
</div>

<div ng-hide="!noData" class="row">
    <div class="form-group col-sm-12" style="text-align: center;">
        Нет данных.
    </div>
</div>

<table ng-hide="noData" class="table table-striped table-hover table-condensed" >
    <thead>
    <tr>
        <th width="5%">
            <a href="#" ng-click="sortType = 'pricelist_id'; sortReverse = !sortReverse">
                Дата
                <span ng-show="sortType == 'pricelist_id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'pricelist_id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'price'; sortReverse = !sortReverse">
                Пользователь
                <span ng-show="sortType == 'price' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'price' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'currency'; sortReverse = !sortReverse">
                Сущность
                <span ng-show="sortType == 'currency' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'currency' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'date_created'; sortReverse = !sortReverse">
                Действие
                <span ng-show="sortType == 'date_created' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'date_created' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th width="5%">
            <a href="#" ng-click="sortType = 'date_start'; sortReverse = !sortReverse">
                ID сущности
                <span ng-show="sortType == 'date_start' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'date_start' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list | orderBy:sortType:sortReverse">
        <td style="cursor: pointer" >{{item.request_date}}</td>
        <td style="cursor: pointer" >{{item.user_id}}</td>
        <td style="cursor: pointer" >{{item.controller}}</td>
        <td style="cursor: pointer" >{{item.action}}</td>
        <td style="cursor: pointer" >{{item.object_id}}</td>
    </tr>

    </tbody>
</table>
