<div class="wrap">
    <h4>{{server.name}} ({{server.id}})</h4>
    <div style="position: fixed; left: 15px; bottom: 0; top: 100px; width: 230px; overflow-y: auto">
        <div class="list-group">
            <a class="list-group-item" ng-click="Redirect.smsTrunkList()" ng-class="{active:tabs.isController('SmsTrunkListCtrl')}">SMS Транки</a>
            <a class="list-group-item" ng-click="Redirect.smsRouteTableList()" ng-class="{active:tabs.isController('SmsRouteTableListCtrl')}">Таблицы маршрутизации</a>
        </div>
        <div class="list-group">
            <a class="list-group-item" ng-click="Redirect.smsTestAuthList()" ng-class="{active:tabs.isController('SmsTestAuthListCtrl')}">Тесты маршрутизации</a>            
            <a class="list-group-item" ng-click="Redirect.smsTestGroupList()" ng-class="{active:tabs.isController('SmsTestGroupListCtrl')}">Группы тестов</a>            
        </div>
        <div class="list-group">
            <a class="list-group-item" ng-click="Redirect.smsOutcomeList()" ng-class="{active:tabs.isController('SmsOutcomeListCtrl')}">Outcomes</a>
        </div>
        <div class="list-group">
            <a class="list-group-item" ng-click="Redirect.alphaNumberList()" ng-class="{active:tabs.isController('AlphaNumberListCtrl')}">Альфа номера</a>
            <a class="list-group-item" ng-click="Redirect.alphaNumberGroupList()" ng-class="{active:tabs.isController('AlphaNumberGroupListCtrl')}">Группы альфа номеров</a>
        </div>
        <div class="list-group">
            <a class="list-group-item" ng-click="Redirect.smsCdrRead()" ng-class="{active:tabs.isController('SmsCdrReportReadCtrl')}">SMSC CDR</a>
        </div>
    </div>

    <div style="position: fixed; overflow: auto; bottom: 0; right: 0; top: 60px; padding-left: 20px; padding-right: 20px; left: 250px;':'left: 0;">
        <tabset class="main-tabs" ng-show="tabs.length > 0" vertical="true" type="'pills'">
            <tab ng-repeat="tab in tabs" active="tab.active" ng-controller="tab.controller">
                <ng-include src="tab.template" onload="init(tab)"></ng-include>
            </tab>
        </tabset>
    </div>
</div>

<div id="popup-alert" class="alert alert-danger" style="cursor: pointer; position: absolute; left: 20%; right: 20%; top: 45px; z-index: 5000;" ng-if="popupErrors"  ng-click="closeErrorsPopup()">
    <button type="button" class="close" ng-click="closeErrorsPopup()"><span aria-hidden="true">×</span></button>
    <h4 ng-if="popupErrors.header">{{popupErrors.header}}</h4>
    <p ng-repeat="error in popupErrors.errors">{{error}}</p>
</div>
