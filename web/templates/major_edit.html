<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">NNP-фильтр {{item.name}}</h3>
        <h3 ng-if="!item.id">Создание NNP-фильтра</h3>
    </div>
    <div class="modal-body">

        <ul class="nav nav-tabs">
            <li class="active"><a href="#major-tab" data-toggle="tab">ННП-фильтр</a></li>
            <li ng-if="item.id"><a href="#major-pricelists-usages-tab" data-toggle="tab">Прайслисты</a></li>
        </ul>

        <br/>

        <div class="tab-content">
            <div class="tab-pane active" id="major-tab">
                <div class="form-group">
                    <label class="col-sm-2 control-label">Название</label>
                    <div class="col-sm-10">
                        <input class="form-control" placeholder="Название" ng-model="item.name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Позиция</label>
                    <div class="col-sm-10">
                        <input class="form-control" placeholder="Позиция" ng-model="item.order" disabled>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Группа</label>
                    <div class="col-sm-10">
                        <select ui-select2 style="width: 100%" tags="true" placeholder="Группа NNP-фильтра" ng-model="item.major_group_id" required>
                            <option value="">-- Выберите --</option>
                            <option ng-repeat="group in majorGroupList" value="{{group.id}}">{{group.name}}</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Номера для обзвона</label>
                    <div class="col-sm-10">
                        <input class="form-control" placeholder="Номера для обзвона" ng-model="item.numbers_to_call">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Страна</label>
                    <div class="col-sm-10">
                        <select ui-select2 style="width: 100%" tags="true" placeholder="Страна" ng-model="item.country_code" required>
                            <option value="">-- Выберите --</option>
                            <option ng-repeat="country in countryList" value="{{country.code}}">{{country.name_rus}}</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="col-sm-2 control-label">Хаб</label>
                    <div class="col-sm-10">
                        <select-box list="hub" model="item.hub_id"></select-box>
                    </div>
                </div>

                <div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label">Страна</label>
                        <div class="col-sm-7">
                            <select ui-select2 ng-model="item.nnp_country" multiple="multiple" style="width: 100%" >
                                <option ng-repeat="country in countryList" value="{{::country.code}}">{{::country.name_rus}}</option>
                            </select>
                        </div>
                        <div class="col-sm-3">
                            <div class="btn-group">
                                <button type="button" class="btn {{!item.nnp_exclude_country ? 'btn-primary active' : 'btn-default'}}" ng-click="item.nnp_exclude_country = false">Выбранные</button>
                                <button type="button" class="btn {{item.nnp_exclude_country ? 'btn-danger active' : 'btn-default'}}" ng-click="item.nnp_exclude_country = true">Кроме выбранных</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" ng-if="item.nnp_country">
                        <label class="col-sm-2 control-label">Регион</label>
                        <div ng-if="regionList && regionList.length > 0" class="col-sm-7">
                            <select ui-select2 ng-model="item.nnp_region" multiple="multiple" style="width: 100%" >
                                <option ng-repeat="region in regionList" value="{{::region.id}}">{{::region.name}}</option>
                            </select>
                        </div>
                        <div ng-if="!regionList || regionList.length == 0" class="col-sm-7">
                            <button type="button"
                                    class="btn btn-primary info"
                                    ng-click="loadRegions()">Загрузить данные
                            </button>
                            <span ng-if="item.nnp_region && item.nnp_region != {}">Текущее значение: {{item.nnp_region}}</span>
                        </div>
                        <div class="col-sm-3">
                            <div class="btn-group">
                                <button type="button" class="btn {{!item.nnp_exclude_region ? 'btn-primary active' : 'btn-default'}}" ng-click="item.nnp_exclude_region = false">Выбранные</button>
                                <button type="button" class="btn {{item.nnp_exclude_region ? 'btn-danger active' : 'btn-default'}}" ng-click="item.nnp_exclude_region = true">Кроме выбранных</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" ng-if="item.nnp_country && item.nnp_region">
                        <label class="col-sm-2 control-label">Город</label>
                        <div ng-if="cityList && cityList.length > 0" class="col-sm-7">
                            <select ui-select2 ng-model="item.nnp_city" multiple="multiple" style="width: 100%" >
                                <option ng-repeat="city in cityList" value="{{::city.id}}">{{::city.name}}</option>
                            </select>
                        </div>
                        <div ng-if="!cityList || cityList.length == 0" class="col-sm-7">
                            <button type="button"
                                    class="btn btn-primary info"
                                    ng-click="loadCities()">Загрузить данные
                            </button>
                            <span ng-if="item.nnp_city && item.nnp_city != {}">Текущее значение: {{item.nnp_city}}</span>
                        </div>
                        <div class="col-sm-3">
                            <div class="btn-group">
                                <button type="button" class="btn {{!item.nnp_exclude_city ? 'btn-primary active' : 'btn-default'}}" ng-click="item.nnp_exclude_city = false">Выбранные</button>
                                <button type="button" class="btn {{item.nnp_exclude_city ? 'btn-danger active' : 'btn-default'}}" ng-click="item.nnp_exclude_city = true">Кроме выбранных</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" ng-if="item.nnp_country">
                        <label class="col-sm-2 control-label">Оператор</label>
                        <div ng-if="operatorList && operatorList.length > 0" class="col-sm-7">
                            <select ui-select2 ng-model="item.nnp_operator" multiple="multiple" style="width: 100%" >
                                <option ng-repeat="operator in operatorList" value="{{::operator.id}}">{{::operator.name}}</option>
                            </select>
                        </div>
                        <div ng-if="!operatorList || operatorList.length == 0" class="col-sm-7">
                            <button type="button"
                                    class="btn btn-primary info"
                                    ng-click="loadOperators()">Загрузить данные
                            </button>
                            <span ng-if="item.nnp_operator && item.nnp_operator != {}">Текущее значение: {{item.nnp_operator}}</span>
                        </div>
                        <div class="col-sm-3">
                            <div class="btn-group">
                                <button type="button" class="btn {{!item.nnp_exclude_operator ? 'btn-primary active' : 'btn-default'}}" ng-click="item.nnp_exclude_operator = false">Выбранные</button>
                                <button type="button" class="btn {{item.nnp_exclude_operator ? 'btn-danger active' : 'btn-default'}}" ng-click="item.nnp_exclude_operator = true">Кроме выбранных</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-sm-2 control-label">Тип NDC</label>
                        <div class="col-sm-7">
                            <select ui-select2 ng-model="item.nnp_ndc_type" multiple="multiple" style="width: 100%" >
                                <option ng-repeat="ndcType in ndcTypeList" value="{{::ndcType.id}}">{{::ndcType.name}}</option>
                            </select>
                        </div>
                        <div class="col-sm-3">
                            <div class="btn-group">
                                <button type="button" class="btn {{!item.nnp_exclude_ndc_type ? 'btn-primary active' : 'btn-default'}}" ng-click="item.nnp_exclude_ndc_type = false">Выбранные</button>
                                <button type="button" class="btn {{item.nnp_exclude_ndc_type ? 'btn-danger active' : 'btn-default'}}" ng-click="item.nnp_exclude_ndc_type = true">Кроме выбранных</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" ng-if="item.nnp_country">
                        <label class="col-sm-2 control-label">NDC</label>
                        <div ng-if="ndcList && ndcList.length > 0" class="col-sm-7">
                            <select ui-select2="{ allow: true}" id="mySelect2" ng-model="item.nnp_ndc" multiple="multiple" style="width: 100%">
                                    <option ng-repeat="ndc in ndcList" value="{{::ndc.id}}">{{::ndc.name}}</option>
                            </select>
                        </div>
                        <div ng-if="!ndcList || ndcList.length == 0" class="col-sm-7">
                            <button type="button"
                                    class="btn btn-primary info"
                                    ng-click="loadNdcs()">Загрузить данные
                            </button>
                            <span ng-if="item.nnp_ndc && item.nnp_ndc != {}">Текущее значение: {{item.nnp_ndc}}</span>
                        </div>
                        <div class="col-sm-3">
                            <div class="btn-group">
                                <button type="button" class="btn {{!item.nnp_exclude_ndc ? 'btn-primary active' : 'btn-default'}}" ng-click="item.nnp_exclude_ndc = false">Выбранные</button>
                                <button type="button" class="btn {{item.nnp_exclude_ndc ? 'btn-danger active' : 'btn-default'}}" ng-click="item.nnp_exclude_ndc = true">Кроме выбранных</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane" id="major-pricelists-usages-tab">
                <table class="table table-striped table-hover table-condensed" >
                    <thead>
                    <tr>
                        <th width="20%">ID</th>
                        <th width="30%">Название</th>
                        <th width="50%">Группа</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr ng-repeat="item in usagesInPricelists">
                        <td style="cursor: pointer" ng-click="clickPricelistItem(item)">{{item.id}}</td>
                        <td style="cursor: pointer" ng-click="clickPricelistItem(item)">{{item.name}}</td>
                        <td style="cursor: pointer" ng-click="clickPricelistItem(item)">{{item.group_name}}</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-if="(item.id && userPermissions['major_edit']) || (!item.id && userPermissions['major_create'])" ng-disabled="form.$invalid || !saveEnabled" ng-click="save()">Сохранить</button>
            <button type="submit" class="btn btn-warning" ng-if="item.id && userPermissions['major_edit']" ng-disabled="form.$invalid || !saveEnabled" ng-click="saveAndUpdate()">Сохранить и применить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
            <action-log-view-button ng-if="item.id && userPermissions['action_log_view']" key="{{item.id}}" type="json/major"></action-log-view-button>
        </div>
    </div>

</form>
