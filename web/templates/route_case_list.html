<div>
    <div class="pull-right">
        <a ng-if="userPermissions['route_case_create']" class="btn btn-primary btn-sm" ng-click="clickCreate()">Создать</a>
        &nbsp;
        <a class="btn btn-primary btn-sm" target="_blank" href="/route-case/export?serverId={{server.id}}">Выгрузить</a>
    </div>
</div>
<h4>Route cases</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed" >
    <thead>
    <tr>
        <th>
            <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                Название
                <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th>Оператор</th>
        <th>Приоритет</th>
        <th>Вес</th>
        <th>&nbsp;</th>
        <th width="10%">
            <a href="#" ng-click="sortType = 'server_id'; sortReverse = !sortReverse">
                Сервер
                <span ng-show="sortType == 'server_id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'server_id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th ng-if="userPermissions['route_case_delete']" width="1%">&nbsp;</th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list | orderBy:sortType:sortReverse | routeCaseFilter:searchQuery:filterFields">
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <div ng-repeat="op in item.trunks">{{op.trunk.name}}</div>
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <div ng-repeat="op in item.trunks">{{op.priority}}</div>
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <div ng-repeat="op in item.trunks">{{op.weight}}</div>
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <span class="label label-warning" ng-if="item.sw_shared">ОБЩИЙ</span>
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.server_id}}</td>
        <td ng-if="userPermissions['route_case_delete']"><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-disabled="item.server_id != server.id" ng-click="deleteItem(item)"></button></td>
    </tr>

    </tbody>
</table>
