<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-body">
        <table class="table table-condensed" style="width: 500px;">
            <tbody>
            <tr ng-repeat="item in list">
                <td ng-if="item.is_pricelist" colspan="4" style="text-align: center;"> (#{{item.id}}) {{item.name}}, валюта {{item.currency_id}}</td>
                <td ng-if="item.is_pricelist">
                    <a target="_blank" href="/pricelist/excel?id={{item.id}}" class="btn btn-success btn-xs">
                        <span class="glyphicon glyphicon-list-alt"></span>
                    </a>
                </td>
                <td ng-if="item.is_pricelist">
                    <a class="btn btn-success btn-xs" ng-click="viewPricelist(item.id)">
                        <span class="glyphicon glyphicon-pencil"></span>
                    </a>
                </td>
                <!---------------------------------------------------->
                <td ng-if="item.is_location" colspan="4" style="border-bottom: 2px solid black;text-align: center;">{{item.location_text}}</td>
                <td ng-if="item.is_location" style="border-bottom: 2px solid black;"></td>
                <td ng-if="item.is_location" style="border-bottom: 2px solid black;"></td>
                <!---------------------------------------------------->
                <td ng-if="item.is_prefix_price && item.is_filter_a_header" rowspan="{{item.total_prefix_count}}" style="text-align: center; vertical-align: middle; border-right: 1px solid lightgrey">
                    {{item.filter_a_name}}
                </td>
                <td ng-if="item.is_prefix_price && item.is_filter_b_header" rowspan="{{item.prefix_count}}" style="text-align: center; vertical-align: middle; border-right: 1px solid lightgrey">
                    {{item.filter_b_name}}<br/>(Интерконнект: {{item.interconnect_price}})
                </td>
                <td ng-if="item.is_prefix_price">{{item.prefix_b}}</td>
                <td ng-if="item.is_prefix_price">{{item.b_number_price}}</td>
                <td ng-if="item.is_prefix_price"></td>
                <td ng-if="item.is_prefix_price">
                    <a class="btn btn-info btn-xs" ng-click="editPrefixPrice(item.prefix_price_id)">
                        <span class="glyphicon glyphicon-pencil"></span>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="button" class="btn btn-success btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
