<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-body">
        <table class="table table-condensed" style="width: 700px;">
            <tbody>
            <tr ng-repeat="item in list">
                <td ng-if="item.is_pricelist" colspan="5" style="text-align: center;">{{item.name}}, валюта {{item.currency_id}} <span style="color: grey; cursor: pointer" ng-click="viewPricelist(item.id)">(#{{item.id}})</span></td>
                <td ng-if="item.is_pricelist">
                    <a target="_blank" href="/pricelist/excel?id={{item.id}}" class="btn btn-success btn-xs">
                        <span class="glyphicon glyphicon-list-alt"></span>
                    </a>
                </td>
                <!---------------------------------------------------->
                <td ng-if="item.is_location" colspan="5" style="border-bottom: 2px solid black;text-align: center;{{item.is_basic ? ' background-color: lightgrey;' : ''}}">{{item.location_text}} <span style="color: grey; cursor: pointer" ng-click="editLocation(item.id)">(#{{item.id}})</span></td>
                <td ng-if="item.is_location" style="border-bottom: 2px solid black;{{item.is_basic ? ' background-color: lightgrey;' : ''}}"></td>
                <!---------------------------------------------------->
                <td ng-if="item.is_prefix_price && item.is_filter_a_header" rowspan="{{item.total_prefix_count}}" style="text-align: center; vertical-align: middle; border-right: 1px solid lightgrey">
                    {{item.filter_a_name}} <span style="color: grey; cursor: pointer" ng-click="editFilterA(item.filter_a_id)">(#{{item.filter_a_id}})</span></span>
                </td>
                <td ng-if="item.is_prefix_price && item.is_filter_b_header" rowspan="{{item.prefix_count}}" style="text-align: center; vertical-align: middle; border-right: 1px solid lightgrey">
                    {{item.filter_b_name}} <span style="color: grey; cursor: pointer" ng-click="editFilterB(item.filter_b_id)">(#{{item.filter_b_id}})</span>
                </td>
                <td ng-if="item.is_prefix_price && item.is_filter_b_header" rowspan="{{item.prefix_count}}" style="text-align: center; vertical-align: middle; border-right: 1px solid lightgrey">
                    И:&nbsp;{{item.interconnect_price}}</span>
                </td>
                <td ng-if="item.is_prefix_price"><span style="cursor: pointer" ng-click="editPrefixPrice(item.prefix_price_id)">{{item.prefix_b}}</span></td>
                <td ng-if="item.is_prefix_price"><span style="cursor: pointer" ng-click="editPrefixPrice(item.prefix_price_id)">{{item.b_number_price}}</span></td>
                <td ng-if="item.is_prefix_price"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="button" class="btn btn-success btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
