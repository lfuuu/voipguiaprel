<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">Пользователь {{item.name}}</h3>
        <h3 ng-if="!item.id">Создание пользователя</h3>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label class="col-sm-2 control-label">Логин</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Логин" ng-model="item.login" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Имя</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Имя" ng-model="item.name" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Пароль</label>
            <div class="col-sm-10">
                <input type="password" class="form-control" placeholder="Пароль" ng-model="item.password">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Роли</label>
            <div class="col-sm-10">
                <select ui-select2 id="modalUserRoleSelect" ng-model="item.assignment" ng-change="onSelectChange()" ng-required="true" style="width: 100%" multiple="multiple">
                    <option value="selectAll">-- Выбрать все --</option>
                    <option value="selectNone">-- Отменить выбор --</option>
                    <option ng-repeat="role in roleList" value="{{role.id}}">{{role.name}}</option>
                </select>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
            <action-log-view-button ng-if="item.name && userPermissions['action_log_view']" key="{{item.name}}" type="json/settings/user"></action-log-view-button>
        </div>
    </div>

</form>
