<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.name">Роль {{item.description}}</h3>
        <h3 ng-if="!item.name">Создание роли</h3>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label class="col-sm-2 control-label">Название</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Название" ng-model="item.name" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Примечание</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Примечание" ng-model="item.description" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Права доступа</label>
            <div class="col-sm-10">
                <select ui-select2 id="modalRoleSelect" ng-model="item.roleAcl" ng-change="onSelectChange()" ng-required="true" style="width: 100%" multiple="multiple">
                    <option value="selectAll">-- Выбрать все --</option>
                    <option value="selectNone">-- Отменить выбор --</option>
                    <option ng-repeat="acl in aclList" value="{{acl.id}}">{{acl.name}}</option>
                </select>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
            <action-log-view-button ng-if="item.name && userPermissions['action_log_view']" key="{{item.name}}" type="json/settings/role"></action-log-view-button>
        </div>
    </div>

</form>
