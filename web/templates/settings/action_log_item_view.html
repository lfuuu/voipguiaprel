<form class="form-horizontal" name="form">
    <div class="modal-header">
        <h3>История изменений {{type}}</h3>
    </div>
    <div class="modal-body">
        <table class="table table-striped table-hover table-condensed" >
            <thead>
            <tr>
                <th>User</th>
                <th>Action</th>
                <th>Date</th>
                <th>Data before</th>
                <th>Data after</th>
            </tr>
            </thead>
            <tbody>
            <tr ng-repeat="item in list">
                <td>{{item.user_name}}</td>
                <td>{{item.action}}</td>
                <td>{{item.request_date}}</td>
                <td>{{item.data_before}}</td>
                <td>{{item.data_after}}</td>
            </tr>

            </tbody>
        </table>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
