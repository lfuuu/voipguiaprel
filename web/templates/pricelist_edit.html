<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">Прайслист {{item.name}}</h3>
        <h3 ng-if="!item.id">Создание прайслиста</h3>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label class="col-sm-2 control-label">Название</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Название" ng-model="item.name" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Описание</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Описание" ng-model="item.description">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Группа</label>
            <div class="col-sm-10">
                <select ui-select2 style="width: 100%" tags="true" placeholder="Группа прайслиста" ng-model="item.pricelist_group_id" required>
                    <option value="">-- Выберите --</option>
                    <option ng-repeat="group in pricelistGroupList" value="{{group.id}}">{{group.name}}</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Тип прайслиста</label>
            <div class="col-sm-10">
                <select ui-select2 style="width: 100%" tags="true" placeholder="Тип прайслиста" ng-model="item.type_id" required>
                    <option value="1">Розница</option>
                    <option value="2">Оператор</option>
                    <option value="3">ОТТ</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Валюта</label>
            <div class="col-sm-10">
                <select ui-select2 ng-model="item.currency_id" placeholder="Валюта" style="width: 100%">
                    <option ng-repeat="currencyItem in currency" value="{{currencyItem.id}}">{{currencyItem.name}}</option>
                </select>
            </div>
        </div>

        <div ng-if="item.id" class="form-group">
            <label class="col-sm-2 control-label">Дата создания</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Дата (ГГГГ-ММ-ДД)" ng-model="item.date_created" readonly>
            </div>
            <!--<div class="col-sm-4">-->
                <!--<button type="button" class="btn btn-success" ng-click="createNewVersion()">Создать новую версию</button>-->
            <!--</div>-->
        </div>

        <div ng-if="!item.id" class="form-group">
            <label class="col-sm-2 control-label">Дата создания</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Дата (ГГГГ-ММ-ДД)" ng-model="item.date_created" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Дата начала действия</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Дата (ГГГГ-ММ-ДД)" ng-model="item.date_start" required>
            </div>
        </div>

        <!--<div class="form-group">-->
            <!--<label class="col-sm-2 control-label">Дата окончания действия</label>-->
            <!--<div class="col-sm-10">-->
                <!--<input class="form-control" placeholder="Время (UTC)" ng-model="item.date_end" required>-->
            <!--</div>-->
        <!--</div>-->

        <div class="form-group">
            <label class="col-sm-2 control-label">Версия прайслиста</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="1" ng-model="item.pricelist_version" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Оригинация</label>
            <div class="col-sm-10">
                <div class="btn-group" ng-click="item.orig = !item.orig">
                    <button type="button" class="btn btn-sm {{item.orig ? 'btn-success active' : 'btn-default'}}">Да</button>
                    <button type="button" class="btn btn-sm {{!item.orig ? 'btn-primary active' : 'btn-default'}}">Нет</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Глобальный</label>
            <div class="col-sm-10">
                <div class="btn-group" ng-click="item.is_global = !item.is_global">
                    <button type="button" class="btn btn-sm {{item.is_global ? 'btn-success active' : 'btn-default'}}">Да</button>
                    <button type="button" class="btn btn-sm {{!item.is_global ? 'btn-primary active' : 'btn-default'}}">Нет</button>
                </div>
            </div>
        </div>

        <div ng-if="item.id" class="form-group">
            <label class="col-sm-2 control-label">Базовое местоположение</label>
            <div class="col-sm-10">
                <select ui-select2 ng-model="item.basic_pricelist_location_id" placeholder="Базовое местоположение" style="width: 100%" >
                    <option value="">-- Выберите --</option>
                    <option ng-repeat="locationItem in locations" value="{{locationItem.id}}">{{locationItem.name}}</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Импортировать из прайслиста</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="1" ng-model="item.old_pricelist_id">
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
