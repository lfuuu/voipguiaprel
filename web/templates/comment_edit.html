<form class="form-horizontal" name="form">
    <div class="modal-header">
        <h3>Комментарий для сущности {{item.object_type_name}}, #ID: {{item.object_id}}</h3>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label class="col-sm-2 control-label">Комментарий</label>
            <div class="col-sm-10">
                <textarea class="form-control" placeholder="Комментарий" ng-model="item.object_comment"></textarea>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
