<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3>Дополнительные настройки</h3>
    </div>
    <div class="modal-body">

        <!-- Nav tabs -->
        <ul class="nav nav-tabs">
            <li class="active"><a href="#instancesettings" data-toggle="tab">Дополнительные настройки</a></li>
        </ul>

        <br/>

        <div class="tab-content">

            <div class="tab-pane active" id="instancesettings">

                <div class="form-group">
                    <label class="col-sm-4 control-label">region_id</label>
                    <div class="col-sm-8">
                        <input class="form-control" ng-model="item.region_id" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-4 control-label">city_geo_id</label>
                    <div class="col-sm-8">
                        <select ui-select2 ng-model="item.city_geo_id" style="width: 100%" >
                            <option value="">-- Выберите страну --</option>
                            <option ng-repeat="geo in item.geos" value="{{geo.id}}">{{geo.name}}</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-4 control-label">name</label>
                    <div class="col-sm-8">
                        <input class="form-control" ng-model="item.name" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-4 control-label">Страна</label>
                    <div class="col-sm-8">
                        <select ui-select2 ng-model="item.country_id" style="width: 100%" >
                            <option value="">-- Выберите страну --</option>
                            <option ng-repeat="country in item.countries" value="{{country.id}}">{{country.name}}</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-4 control-label">city_id</label>
                    <div class="col-sm-8">
                        <select ui-select2 ng-model="item.city_id" style="width: 100%" >
                            <option value="">-- Выберите город --</option>
                            <option ng-repeat="city in item.cities" value="{{city.id}}">{{city.name}}</option>
                        </select>
                    </div>
                </div>

            </div>

        </div>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить
            </button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
