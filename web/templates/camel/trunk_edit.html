<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">Транк {{item.name}}</h3>
        <h3 ng-if="!item.id">Создание транка</h3>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label class="col-sm-2 control-label">Название</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Название" ng-model="item.name" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Префикслист GT</label>
            <div class="col-sm-10">
                <select ui-select2 style="width: 100%" tags="true" placeholder="GT" ng-model="item.prefixlist_id" required>
                    <option value="">-- Выберите --</option>
                    <option ng-repeat="prefixlist in prefixlistList" value="{{prefixlist.id}}">{{prefixlist.name}}</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Таблица маршрутизации</label>
            <div class="col-sm-10">
                <select ui-select2 style="width: 100%" tags="true" placeholder="Route Table" ng-model="item.camel_route_table_id" required>
                    <option value="">-- Выберите --</option>
                    <option ng-repeat="routeTable in routeTableList" value="{{routeTable.id}}">{{routeTable.name}}</option>
                </select>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
            <action-log-view-button ng-if="item.id && userPermissions['action_log_view']" key="{{item.id}}" type="json/camel/trunk"></action-log-view-button>
        </div>
    </div>

</form>
