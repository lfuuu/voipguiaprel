<div ng-if="userPermissions['camel_gt_create']" class="pull-right">
    <a class="btn btn-primary btn-sm" ng-click="clickCreate()">Создать</a>
</div>
<h4>Справочник GT</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed">
    <thead>
        <tr>
            <th width="3%">
                <a href="#" ng-click="sortType = 'id'; sortReverse = !sortReverse">
                    ID
                    <span ng-show="sortType == 'id' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'id' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th>
                <a href="#" ng-click="sortType = 'gt'; sortReverse = !sortReverse">
                    GT
                    <span ng-show="sortType == 'gt' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'gt' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'oper'; sortReverse = !sortReverse">
                    Oper
                    <span ng-show="sortType == 'oper' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'oper' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'country'; sortReverse = !sortReverse">
                    Country
                    <span ng-show="sortType == 'country' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'country' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'area'; sortReverse = !sortReverse">
                    Area
                    <span ng-show="sortType == 'area' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'area' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'loc'; sortReverse = !sortReverse">
                    Loc
                    <span ng-show="sortType == 'loc' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'loc' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="1%"></th>
            <th ng-if="userPermissions['camel_gt_delete']" width="1%"></th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="item in list | orderBy:sortType:sortReverse | trunkFilter:searchQuery:filterFields">
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.gt}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.oper}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.country}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.area}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.loc}}</td>
            <td>
                <comment-icon ng-if="item.id" key="{{item.id}}" type="camelGt" comment="item.object_comment"></comment-icon>
            </td>
            <td ng-if="userPermissions['camel_gt_delete']"><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button></td>
        </tr>
    </tbody>
</table>
