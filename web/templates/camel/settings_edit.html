<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3>Общие настройки</h3>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label class="col-sm-4 control-label">Название</label>
            <div class="col-sm-8">
                <input class="form-control" ng-model="item.name" ng-focus="nameChanged()"/>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-4 control-label">Тип</label>
            <div class="col-sm-8">
                <input class="form-control" ng-model="item.type" />
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-4 control-label">Адрес camelGW сервера</label>
            <div class="col-sm-8">
                <input class="form-control" ng-model="item.camel_gw" />
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-4 control-label">Активен</label>
            <div class="col-sm-8">
              <div class="btn-group" ng-click="item.active = !item.active">
                <button type="button" class="btn btn-sm {{item.active ? 'btn-success active' : 'btn-default'}}">Да</button>
                <button type="button" class="btn btn-sm {{!item.active ? 'btn-primary active' : 'btn-default'}}">Нет</button>
              </div>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить
            </button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
