<div ng-if="userPermissions['camel_test_auth_create']" class="pull-right">
    <a class="btn btn-primary btn-sm" ng-click="clickCreate()">Создать</a>
</div>
<h4>Тесты маршрутизации</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed">
    <thead>
        <tr>
            <th width="3%">
                <a href="#" ng-click="sortType = 'id'; sortReverse = !sortReverse">
                    ID
                    <span ng-show="sortType == 'id' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'id' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="10%">
                <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                    Название
                    <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="20%"> </th>
            <th>
                <a href="#" ng-click="sortType = 'a_number'; sortReverse = !sortReverse">
                    А номер
                    <span ng-show="sortType == 'a_number' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'a_number' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th>
                <a href="#" ng-click="sortType = 'b_number'; sortReverse = !sortReverse">
                    B номер
                    <span ng-show="sortType == 'b_number' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'b_number' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th>
                <a href="#" ng-click="sortType = 'gt_number'; sortReverse = !sortReverse">
                    GT номер
                    <span ng-show="sortType == 'gt_number' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'gt_number' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="1%"></th>
            <th width="1%"></th>
            <th ng-if="userPermissions['camel_test_auth_delete']" width="1%"></th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="item in list | orderBy:sortType:sortReverse | basicFilter:searchQuery:filterFields">
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
            <td>
                <button type="button" class="btn btn-default btn-sm" ng-click="showTestPrimary(item)">MAIN</button>
            </td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.a_number}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.b_number}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.gt_number}}</td>
            <td ng-if="userPermissions['camel_test_auth_create']"><button type="button" class="btn btn-default btn-sm" ng-click="cloneTest(item)">Клонировать</button></td>
            <td>
                <comment-icon ng-if="item.id" key="{{item.id}}" type="camelTestAuth" comment="item.object_comment"></comment-icon>
            </td>
            <td ng-if="userPermissions['camel_test_auth_delete']"><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button></td>
        </tr>
    </tbody>
</table>
