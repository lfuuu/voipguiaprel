<form class="form-horizontal" name="form" ng-if="item">

  <div class="modal-header">
    <h3 ng-if="item.id">Коннектор {{item.name}}</h3>
    <h3 ng-if="!item.id">Создание коннектора</h3>
  </div>

  <div class="modal-body">
    <div class="tab-content">
      <div class="tab-pane active" id="trunk">

        <!-- === Блок 1. Параметры коннектора (наша БД) === -->
        <div class="form-group">
          <div class="col-sm-12">
            <h4 class="text-muted" style="margin-top:0;">Параметры коннектора (в нашей БД)</h4>
            <hr style="margin:8px 0 16px;">
          </div>
        </div>

        <!-- 1. Шлюз -->
        <div class="form-group">
          <label class="col-sm-2 control-label">Шлюз</label>
          <div class="col-sm-10">
            <select class="form-control"
                    ng-model="item.sms_gate_id"
                    ng-options="g.id as g.name for g in gatewayList"
                    required>
              <option value="" disabled>— Выберите шлюз —</option>
            </select>
          </div>
        </div>

        <!-- 2. Тип -->
        <div class="form-group" ng-if="item.sms_gate_id">
          <label class="col-sm-2 control-label">Тип</label>
          <div class="col-sm-10">
            <select class="form-control"
                    ng-model="item.connector_type_id"
                    ng-options="t.id as t.name for t in connectorTypeList"
                    required>
              <option value="" disabled>— Выберите тип —</option>
            </select>
          </div>
        </div>

        <!-- 3. Название -->
        <div class="form-group">
          <label class="col-sm-2 control-label">Название</label>
          <div class="col-sm-10">
            <input class="form-control"
                   placeholder="Название"
                   ng-model="item.name"
                   required>
          </div>
        </div>

        <!-- 5. Таблица маршрутизации -->
        <div class="form-group">
          <label class="col-sm-2 control-label">Таблица маршрутизации</label>
          <div class="col-sm-10">
            <select class="form-control"
                    ng-model="item.a2psms_route_table_id"
                    ng-options="r.id as r.name for r in routeTableList"
                    required>
              <option value="" disabled>— Выберите таблицу —</option>
            </select>
          </div>
        </div>

        <!-- 6. Тип протокола -->
        <div class="form-group"
             ng-if="item.sms_gate_id==MCMCN_ID && item.connector_type_id==AGG_ID">
          <label class="col-sm-2 control-label">Тип протокола</label>
          <div class="col-sm-10">
            <select class="form-control"
                    ng-model="item.connector_proto_id"
                    ng-options="p.id as p.name for p in protocolList"
                    required>
              <option value="" disabled>— Выберите протокол —</option>
            </select>
          </div>
        </div>

        <!-- === Блок 2. Внешняя конфигурация (API) === -->
        <div class="form-group" ng-if="item.sms_gate_id==MCMCN_ID && item.connector_type_id==AGG_ID">
          <div class="col-sm-12">
            <div class="panel panel-default" style="border-color:#cfd8dc;">
              <div class="panel-heading" style="background:#f7f9fa;border-color:#cfd8dc;">
                <strong>
                  Внешняя конфигурация
                  <span ng-if="item.connector_proto_id===1">(SMPP)</span>
                  <span ng-if="item.connector_proto_id===2">(REST API)</span>
                </strong>
                <span class="text-muted" style="margin-left:8px;">(редактируется через внешний сервис)</span>
              </div>
              <div class="panel-body">

                <!-- 7. Параметры SMPP -->
                <div ng-if="item.connector_proto_id===1">

                  <div class="form-group">
                    <label class="col-sm-2 control-label">Host</label>
                    <div class="col-sm-10">
                      <input type="text" class="form-control"
                             ng-model="smpp.url" required>
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="col-sm-2 control-label">Port</label>
                    <div class="col-sm-10">
                      <input type="text" class="form-control"
                             ng-model="smpp.port" required>
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="col-sm-2 control-label">SMSC Username</label>
                    <div class="col-sm-10">
                      <input type="text" class="form-control"
                             ng-model="smpp.smsc_username" required>
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="col-sm-2 control-label">SMSC Password</label>
                    <div class="col-sm-10">
                      <input type="text" class="form-control"
                             ng-model="smpp.smsc_password" required>
                    </div>
                  </div>

                  <!-- Кнопки действий SMPP -->
                  <div class="form-group">
                    <div class="col-sm-10 col-sm-offset-2">
                      <button type="button" class="btn btn-info btn-sm"
                              ng-click="modifyConfig()" ng-disabled="form.$invalid">
                        Modify SMPP
                      </button>
                      <button type="button" class="btn btn-danger btn-sm"
                              ng-click="deleteConfig()">
                        Delete SMPP
                      </button>
                    </div>
                  </div>
                </div>

                <!-- 8. Параметры REST -->
                <div ng-if="item.connector_proto_id===2">

                  <div class="form-group">
                    <label class="col-sm-2 control-label">URL</label>
                    <div class="col-sm-10">
                      <input type="text" class="form-control"
                             ng-model="rest.url" required>
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="col-sm-2 control-label">Method</label>
                    <div class="col-sm-10">
                      <input type="text" class="form-control"
                             ng-model="rest.method" required>
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="col-sm-2 control-label">Content-Type</label>
                    <div class="col-sm-10">
                      <input type="text" class="form-control"
                             ng-model="rest.contentType" required>
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="col-sm-2 control-label">Authorization-Token</label>
                    <div class="col-sm-10">
                      <input type="text" class="form-control"
                             ng-model="rest.authToken">
                    </div>
                  </div>

                  <!-- Кнопки действий REST -->
                  <div class="form-group">
                    <div class="col-sm-10 col-sm-offset-2">
                      <button type="button" class="btn btn-info btn-sm"
                              ng-click="modifyConfig()" ng-disabled="form.$invalid">
                        Modify API
                      </button>
                      <button type="button" class="btn btn-danger btn-sm"
                              ng-click="deleteConfig()">
                        Delete API
                      </button>
                    </div>
                  </div>
                </div>

              </div><!-- /.panel-body -->
            </div><!-- /.panel -->
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="modal-footer">
    <div class="pull-left">
      <button type="submit"
              class="btn btn-success"
              ng-disabled="form.$invalid"
              ng-click="save()">Сохранить</button>
      <button type="button"
              class="btn btn-default btn-sm"
              ng-click="back()">Закрыть</button>
      <action-log-view-button
        ng-if="item.id && userPermissions['action_log_view']"
        key="{{item.id}}"
        type="json/sms/trunk">
      </action-log-view-button>
    </div>
  </div>

</form>
