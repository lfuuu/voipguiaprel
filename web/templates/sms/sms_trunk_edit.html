<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">Транк {{item.name}}</h3>
        <h3 ng-if="!item.id">Создание транка</h3>
    </div>
    <div class="modal-body">
        <div class="tab-content">
            <div class="tab-pane active" id="trunk">
                <div class="form-group">
                    <label class="col-sm-2 control-label">Название</label>
                    <div class="col-sm-10">
                        <input class="form-control" placeholder="Название" ng-model="item.name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-2 control-label">Таблица маршрутизации</label>
                    <div class="col-sm-10">
                        <sms-select-box list="routeTable" model="item.camel_route_table_id" required></sms-select-box>
                    </div>
                </div>

            </div>    
        </div>
    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
            <action-log-view-button ng-if="item.id && userPermissions['action_log_view']" key="{{item.id}}" type="json/sms/trunk"></action-log-view-button>
        </div>
    </div>

</form>
