<div ng-if="userPermissions['sms_test_group_create']" class="group_test">
    <div class="group_test">
        <a class="btn btn-primary btn-sm" ng-click="clickCreate()">Создать</a>
</div>
<h4>Группы тестов</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed">
    <thead>
        <tr>
            <th width="3%">
                <a href="#" ng-click="sortType = 'id'; sortReverse = !sortReverse">
                    ID
                    <span ng-show="sortType == 'id' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'id' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th>
                <a href="#" ng-click="sortType = 'group_name'; sortReverse = !sortReverse">
                    Название
                    <span ng-show="sortType == 'group_name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'group_name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="1%"></th>
            <th ng-if="userPermissions['sms_test_group_delete']" width="1%"></th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="item in list | orderBy:sortType:sortReverse | basicFilter:searchQuery:filterFields">
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.group_name}}</td>
            <td>
                <comment-icon ng-if="item.id" key="{{item.id}}" type="camelTestGroup" comment="item.object_comment"></comment-icon>
            </td>
            <td ng-if="userPermissions['sms_test_group_delete']"><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button></td>
        </tr>
    </tbody>
</table>
