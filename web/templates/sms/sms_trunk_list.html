<div ng-if="userPermissions['camel_trunk_create']" class="pull-right">
    <a class="btn btn-primary btn-sm" ng-click="clickCreate()">Создать</a>
</div>
<h4>SMS Транки</h4>
<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed">
    <thead>
        <tr>
            <th width="3%">
                <a href="#" ng-click="sortType = 'id'; sortReverse = !sortReverse">
                    ID
                    <span ng-show="sortType == 'id' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'id' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th>
                <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                    Название
                    <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="20%">
                <a href="#" ng-click="sortType = 'server_id'; sortReverse = !sortReverse">
                    Server id
                    <span ng-show="sortType == 'server_id' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'server_id' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="20%">
                <a href="#" ng-click="sortType = 'a2psms_route_table_id'; sortReverse = !sortReverse">
                    Таблица маршрутизации (id)
                    <span ng-show="sortType == 'a2psms_route_table_id' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'a2psms_route_table_id' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="20%">
                <a href="#" ng-click="sortType = 'route_name'; sortReverse = !sortReverse">
                    Таблица маршрутизации (название)
                    <span ng-show="sortType == 'route_name' && sortReverse" class="caret-down"></span>
                    <span ng-show="sortType == 'route_name' && !sortReverse" class="caret-up"></span>
                </a>
            </th>
            <th width="1%"></th>
            <th ng-if="userPermissions['camel_trunk_delete']" width="1%"></th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="item in list | orderBy:sortType:sortReverse | trunkFilter:searchQuery:filterFields">
            <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
            <td style="cursor: pointer">{{item.name}}</td>
            <td style="cursor: pointer">{{item.server_id}}</td>
            <td style="cursor: pointer">{{item.a2psms_route_table_id}}</td>
            <td style="cursor: pointer">{{item.route_name}}</td>

            <td ng-if="userPermissions['camel_trunk_delete']"><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button></td>
        </tr>
    </tbody>
</table>
