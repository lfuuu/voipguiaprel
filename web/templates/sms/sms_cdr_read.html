<style>
  [popover] {
    display: initial;
    position: initial;
    margin: initial;
  }
  .search-form-item .search-field-label {
    text-align: right;
    padding-top: 7px;
  }
  .search-input {
    padding-top: 5px;
  }
</style>

<h4>
  Отчёт по SMS CDR
  <button type="submit"
          class="btn btn-success search-form-button"
          ng-click="clickSearch()">
    Поиск
  </button>
  <button type="submit"
          class="btn btn-warning search-form-button"
          ng-hide="hideFilter"
          ng-click="hideFilter = true">
    Скрыть фильтр
  </button>
  <button type="submit"
          class="btn btn-info search-form-button"
          ng-hide="!hideFilter"
          ng-click="hideFilter = false">
    Показать фильтр
  </button>
</h4>

<form ng-hide="hideFilter">
  <div class="form-group">
    <!-- Row 1: Session ID, Limit -->
    <div class="row">
      <div class="form-group col-sm-6 search-form-item">
        <label class="col-sm-3 search-field-label">Session ID</label>
        <div class="col-sm-9 search-input">
          <input class="form-control"
                 placeholder="Введите Session ID"
                 ng-model="item.sessionid"
                 ng-change="clickSearch()">
        </div>
      </div>
      <div class="form-group col-sm-6 search-form-item">
        <label class="col-sm-3 search-field-label">Limit</label>
        <div class="col-sm-9 search-input">
          <input class="form-control"
                 placeholder="100"
                 ng-model="item.limit"
                 ng-change="clickSearch()">
        </div>
      </div>
    </div>

    <!-- Row 2: MSISDN, Destination -->
    <div class="row">
      <div class="form-group col-sm-6 search-form-item">
        <label class="col-sm-3 search-field-label">MSISDN</label>
        <div class="col-sm-9 search-input">
          <input class="form-control"
                 placeholder="Введите MSISDN"
                 ng-model="item.msisdn"
                 ng-change="clickSearch()">
        </div>
      </div>
      <div class="form-group col-sm-6 search-form-item">
        <label class="col-sm-3 search-field-label">Destination</label>
        <div class="col-sm-9 search-input">
          <input class="form-control"
                 placeholder="Введите Destination"
                 ng-model="item.destination"
                 ng-change="clickSearch()">
        </div>
      </div>
    </div>

    <!-- Row 3: Direction -->
    <div class="row">
      <div class="form-group col-sm-6 search-form-item">
        <label class="col-sm-3 search-field-label">Direction</label>
        <div class="col-sm-9 search-input">
          <select class="form-control" ui-select2
                  ng-model="item.direction"
                  ng-change="clickSearch()">
            <option value="">-- Любое --</option>
            <option value="1">Исходящее</option>
            <option value="2">Входящее</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Row 4: Country / Network -->
    <div class="row">
      <div class="form-group col-sm-6 search-form-item">
        <label class="col-sm-3 search-field-label">Country</label>
        <div class="col-sm-9 search-input">
          <select class="form-control" ui-select2
                  ng-model="item.mcc"
                  ng-options="o.mcc as o.country for o in countryOptions"
                  ng-change="clickSearch()">
            <option value="">-- Любая страна --</option>
          </select>
        </div>
      </div>
      <div class="form-group col-sm-6 search-form-item">
        <label class="col-sm-3 search-field-label">Network</label>
        <div class="col-sm-9 search-input">
          <select class="form-control" ui-select2
                  ng-model="item.mnc"
                  ng-options="o.mnc as o.network for o in networkOptions"
                  ng-change="clickSearch()">
            <option value="">-- Любая сеть --</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Row 5: Time -->
    <div class="row">
      <div class="form-group col-sm-6 search-form-item">
        <label class="col-sm-3 search-field-label">Время</label>
        <div class="col-sm-9 search-input">
          <div class="btn-group" style="margin-right:10px;">
            <button type="button"
                    class="btn btn-info dropdown-toggle"
                    data-toggle="dropdown">
              <span ng-if="item.is_time_absolute">Absolute</span>
              <span ng-if="!item.is_time_absolute">Relative</span>
              <span class="caret"></span>
            </button>
            <ul class="dropdown-menu">
              <li><a href ng-click="item.is_time_absolute = true; clickSearch()">Absolute</a></li>
              <li><a href ng-click="item.is_time_absolute = false; clickSearch()">Relative</a></li>
            </ul>
          </div>
          <span ng-if="item.is_time_absolute" style="display:inline-block;">
            <input type="text"
                   class="form-control"
                   style="display:inline-block;width:220px;"
                   ng-model="item.time_from"
                   placeholder="From"
                   ng-change="clickSearch()">
            &ndash;
            <input type="text"
                   class="form-control"
                   style="display:inline-block;width:220px;"
                   ng-model="item.time_to"
                   placeholder="To"
                   ng-change="clickSearch()">
          </span>
          <span ng-if="!item.is_time_absolute" style="display:inline-block;width:auto;">
            <select class="form-control"
                    style="display:inline-block;width:250px;"
                    ui-select2
                    ng-model="item.time_relative"
                    ng-options="ti.id as ti.name for ti in timeIntervals"
                    ng-change="clickSearch()">
              <option value="">-- Выберите --</option>
            </select>
          </span>
        </div>
      </div>
    </div>

  </div>
</form>

<div ng-hide="!isLoading" class="row">
  <div class="form-group col-sm-12 text-center">
    Идёт загрузка данных…
  </div>
</div>
<div ng-hide="!noData" class="row">
  <div class="form-group col-sm-12 text-center">
    Нет данных.
  </div>
</div>

<table ng-hide="noData" class="table table-striped table-hover table-condensed">
  <thead>
    <tr>
      <th><a href ng-click="sort('dt_create')">Create Time</a></th>
      <th><a href ng-click="sort('sessionid')">Session ID</a></th>
      <th><a href ng-click="sort('msisdn')">MSISDN</a></th>
      <th><a href ng-click="sort('country')">Country</a></th>
      <th><a href ng-click="sort('network')">Network</a></th>
      <th><a href ng-click="sort('destination')">Destination</a></th>
      <th><a href ng-click="sort('direction')">Dir</a></th>
      <th><a href ng-click="sort('raw_count')">Raw</a></th>
    </tr>
  </thead>
  <tbody>
    <tr ng-repeat="item in list | orderBy:sortType:sortReverse"
        ng-click="openSmsRawModal(item)">
      <td>{{item.dt_create}}</td>
      <td>{{item.sessionid}}</td>
      <td>{{item.msisdn}}</td>
      <td>{{item.country}}</td>
      <td>{{item.network}}</td>
      <td>{{item.destination}}</td>
      <td>{{item.direction}}</td>
      <td>
        <span ng-if="item.raw_count>0" class="glyphicon glyphicon-ok text-success"></span>
        <span ng-if="item.raw_count==0" class="glyphicon glyphicon-remove text-danger"></span>
      </td>
    </tr>
  </tbody>
</table>
