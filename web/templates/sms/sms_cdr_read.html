<h4>
    Отчёт по SMS CDR (новый)
    <button type="submit" class="btn btn-success search-form-button" ng-click="clickSearch()">Поиск</button>
    <button type="submit" ng-hide="hideFilter"  class="btn btn-warning search-form-button" ng-click="hideFilter = true">Скрыть фильтр</button>
    <button type="submit" ng-hide="!hideFilter" class="btn btn-info    search-form-button" ng-click="hideFilter = false">Показать фильтр</button>
</h4>

<form ng-hide="hideFilter">
<div class="form-group">

<!-- Row 1: Session ID, Limit -->
<div class="row">
  <div class="form-group col-sm-6 search-form-item">
    <label class="col-sm-3 search-field-label">Session ID</label>
    <div  class="col-sm-9 search-input">
      <input class="form-control" placeholder="Введите Session ID" ng-model="item.sessionid" ng-change="clickSearch()">
    </div>
  </div>
  <div class="form-group col-sm-6 search-form-item">
    <label class="col-sm-3 search-field-label">Limit</label>
    <div  class="col-sm-9 search-input">
      <input class="form-control" placeholder="100" ng-model="item.limit" ng-change="clickSearch()">
    </div>
  </div>
</div>

<!-- Row 2: MSISDN, Destination -->
<div class="row">
  <div class="form-group col-sm-6 search-form-item">
    <label class="col-sm-3 search-field-label">MSISDN</label>
    <div  class="col-sm-9 search-input">
      <input class="form-control" placeholder="Введите MSISDN" ng-model="item.msisdn" ng-change="clickSearch()">
    </div>
  </div>
  <div class="form-group col-sm-6 search-form-item">
    <label class="col-sm-3 search-field-label">Destination</label>
    <div  class="col-sm-9 search-input">
      <input class="form-control" placeholder="Введите Destination" ng-model="item.destination" ng-change="clickSearch()">
    </div>
  </div>
</div>

<!-- Row 3: Direction -->
<div class="row">
    <div class="form-group col-sm-6 search-form-item">
      <label class="col-sm-3 search-field-label">Direction</label>
      <div  class="col-sm-9 search-input">
        <select class="form-control" ui-select2
                ng-model="item.direction"
                ng-change="clickSearch()">
          <option value="">-- Любое --</option>
          <option value="1">Исходящее</option>
          <option value="2">Входящее</option>
        </select>
      </div>
    </div>
  </div>
  
  <!-- Row 4: Country (MCC) / Network (MNC) -->
  <div class="row">
    <!-- Country -->
    <div class="form-group col-sm-6 search-form-item">
      <label class="col-sm-3 search-field-label">Country</label>
      <div  class="col-sm-9 search-input">
        <select class="form-control" ui-select2
                ng-model="item.mcc"
                ng-options="o.mcc as o.country for o in mccOptions track by o.mcc"
                ng-change="clickSearch()">
          <option value="">-- Любая страна --</option>
        </select>
      </div>
    </div>
  
    <!-- Network -->
    <div class="form-group col-sm-6 search-form-item">
      <label class="col-sm-3 search-field-label">Network</label>
      <div  class="col-sm-9 search-input">
        <select class="form-control" ui-select2
                ng-model="item.mnc"
                ng-options="o.mnc as o.network for o in mncOptions | filter:{mcc:item.mcc} track by o.mnc"
                ng-change="clickSearch()">
          <option value="">-- Любая сеть --</option>
        </select>
      </div>
    </div>
  </div>
  
<!-- Row 4: фильтр времени (как раньше) -->
<div class="row">
  <div class="form-group col-sm-6 search-form-item">
    <label class="col-sm-3 search-field-label">Время</label>
    <div  class="col-sm-9 search-input">
      <div class="btn-group" style="margin-right:10px;">
        <button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">
          <span ng-if="item.is_time_absolute">Absolute</span>
          <span ng-if="!item.is_time_absolute">Relative</span>
          <span class="caret"></span>
        </button>
        <ul class="dropdown-menu">
          <li><a href="#" ng-click="item.is_time_absolute = true;  clickSearch()">Absolute</a></li>
          <li><a href="#" ng-click="item.is_time_absolute = false; clickSearch()">Relative</a></li>
        </ul>
      </div>

      <!-- Absolute -->
      <span ng-if="item.is_time_absolute" style="display:inline-block;">
        <input type="text" class="form-control" style="display:inline-block;width:220px;"
               ng-model="item.time_from" placeholder="From" ng-change="clickSearch()">
        <span style="margin:0 5px;">–</span>
        <input type="text" class="form-control" style="display:inline-block;width:220px;"
               ng-model="item.time_to"   placeholder="To"   ng-change="clickSearch()">
      </span>

      <!-- Relative -->
      <span ng-if="!item.is_time_absolute" style="display:inline-block;width:auto;">
        <select class="form-control" style="display:inline-block;width:250px;"
                ui-select2 ng-model="item.time_relative" placeholder="Выберите интервал" ng-change="clickSearch()">
          <option value="">-- Выберите --</option>
          <option ng-repeat="timeInterval in timeIntervals" value="{{timeInterval.id}}">{{timeInterval.name}}</option>
        </select>
      </span>
    </div>
  </div>
</div>

</div> <!-- /.form-group -->
</form>

<!-- индикаторы загрузки / «нет данных» -->
<div ng-hide="!isLoading" class="row"><div class="col-sm-12" style="text-align:center;">Идёт загрузка данных…</div></div>
<div ng-hide="!noData"    class="row"><div class="col-sm-12" style="text-align:center;">Нет данных.</div></div>

<!-- таблица результатов -->
<table ng-hide="noData" class="table table-striped table-hover table-condensed">
  <thead>
    <tr>
      <th width="15%"><a href="#" ng-click="sortType = 'dt_create';   sortReverse = !sortReverse">Create Time
          <span ng-show="sortType=='dt_create'   && sortReverse" class="caret-down"></span>
          <span ng-show="sortType=='dt_create'   && !sortReverse" class="caret-up"></span></a></th>
      <th width="15%"><a href="#" ng-click="sortType = 'sessionid';   sortReverse = !sortReverse">Session ID
          <span ng-show="sortType=='sessionid'   && sortReverse" class="caret-down"></span>
          <span ng-show="sortType=='sessionid'   && !sortReverse" class="caret-up"></span></a></th>
      <th width="15%"><a href="#" ng-click="sortType = 'msisdn';      sortReverse = !sortReverse">MSISDN
          <span ng-show="sortType=='msisdn'      && sortReverse" class="caret-down"></span>
          <span ng-show="sortType=='msisdn'      && !sortReverse" class="caret-up"></span></a></th>
          <th><a href="#" ng-click="sort('country')">Country</a></th>
          <th><a href="#" ng-click="sort('network')">Network</a></th>
      <th width="15%"><a href="#" ng-click="sortType = 'destination'; sortReverse = !sortReverse">Destination
          <span ng-show="sortType=='destination' && sortReverse" class="caret-down"></span>
          <span ng-show="sortType=='destination' && !sortReverse" class="caret-up"></span></a></th>
      <th width="10%"><a href="#" ng-click="sortType = 'direction';   sortReverse = !sortReverse">Dir
          <span ng-show="sortType=='direction'   && sortReverse" class="caret-down"></span>
          <span ng-show="sortType=='direction'   && !sortReverse" class="caret-up"></span></a></th>
      <th width="10%"><a href="#" ng-click="sortType = 'raw_count';   sortReverse = !sortReverse">Raw
          <span ng-show="sortType=='raw_count'   && sortReverse" class="caret-down"></span>
          <span ng-show="sortType=='raw_count'   && !sortReverse" class="caret-up"></span></a></th>
    </tr>
  </thead>
  <tbody>
    <tr ng-repeat="item in list | orderBy:sortType:sortReverse" ng-click="openSmsRawModal(item)">
      <td>{{item.dt_create}}</td>
      <td>{{item.sessionid}}</td>
      <td>{{item.msisdn}}</td>
      <td>{{item.country}}</td>
        <td>{{item.network}}</td>
      <td>{{item.destination}}</td>
      <td>{{item.direction}}</td>
      <td>
        <span ng-if="item.raw_count > 0" class="glyphicon glyphicon-ok"    style="color:green;" title="Raw SMS данные присутствуют"></span>
        <span ng-if="item.raw_count == 0" class="glyphicon glyphicon-remove" style="color:red;"  title="Raw SMS данные отсутствуют"></span>
      </td>
    </tr>
  </tbody>
</table>
