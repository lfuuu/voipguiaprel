<div>
    <a class="btn btn-primary search-form-button" ng-click="clickCreate()">Создать</a>
    <button type="submit" class="btn btn-success search-form-button" ng-click="clickSearch()">Поиск</button>
    <button type="submit" ng-hide="hideFilter" class="btn btn-warning search-form-button" ng-click="hideFilter = true">Скрыть фильтр</button>
    <button type="submit" ng-hide="!hideFilter" class="btn btn-info search-form-button" ng-click="hideFilter = false">Показать фильтр</button>
  </div>
  <h4>Тесты маршрутизации</h4>
  
  <form ng-hide="hideFilter">
    <div class="form-group">
      <div class="row">
        <div class="form-group col-sm-4 search-form-item">
          <label class="col-sm-2 search-field-label">ID</label>
          <div class="col-sm-10 search-input">
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchArray.id" ng-keydown="$event.keyCode === 13 && refreshList()">
          </div>
        </div>
        <div class="form-group col-sm-4 search-form-item">
          <label class="col-sm-2 search-field-label">Название</label>
          <div class="col-sm-10 search-input">
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchArray.name" ng-keydown="$event.keyCode === 13 && refreshList()">
          </div>
        </div>
        <div class="form-group col-sm-4 search-form-item">
          <label class="col-sm-2 search-field-label">Группа</label>
          <div class="col-sm-10 search-input">
            <select class="search-form-select" ui-select2 style="width: 100%" placeholder="Группа" ng-model="searchArray.group_id" ng-change="refreshList()" required>
              <option value="">-- Выберите группу --</option>
              <option ng-repeat="group in testGroupList" value="{{group.id}}">{{group.name}}</option>
            </select>
          </div>
        </div>
      </div>
      
       <div class="row">
        <div class="form-group col-sm-4 search-form-item">
        <label class="col-sm-2 search-field-label">Шлюз</label>
        <div class="col-sm-10 search-input">
          <select class="search-form-select" ui-select2 style="width: 100%"
                  placeholder="Шлюз"
                  ng-model="searchArray.gate_id"
                  ng-change="refreshList()">
            <option value="">-- Выберите шлюз --</option>
            <option ng-repeat="gate in gateList" value="{{gate.id}}">
              {{gate.name}}
            </option>
          </select>
        </div>
      </div>
        <div class="form-group col-sm-4 search-form-item">
                <label class="col-sm-2 search-field-label">SMS Коннектор</label>
                <div class="col-sm-10 search-input">
                  <select class="search-form-select" ui-select2 style="width: 100%"
              placeholder="Транк"
              ng-model="searchArray.trunk"
              ng-change="refreshList()">
        <option value="">-- Выберите транк --</option>
        <option ng-repeat="trunk in trunkFiltered" value="{{trunk.name}}">
          {{trunk.name}}
        </option>
        </select>

          </div>
        </div>
        
      </div>
    </div>
  </form>
  
  <table class="table table-striped table-hover table-condensed">
    <thead>
      <tr>
        <th width="3%">
          <a href="#" ng-click="sortType = 'id'; sortReverse = !sortReverse">
            ID
            <span ng-show="sortType == 'id' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'id' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <th width="1%">
        </th>
        <th width="10%">
          <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
            Название
            <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
      </th>
      <th width="1%">
      </th>
        <th width="20%">
          <a href="#" ng-click="sortType = 'trunk_name'; sortReverse = !sortReverse">
            Транк
            <span ng-show="sortType == 'trunk_name' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'trunk_name' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <th width="20%">
          <a href="#" ng-click="sortType = 'testgroup_name'; sortReverse = !sortReverse">
            Группа
            <span ng-show="sortType == 'testgroup_name' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'testgroup_name' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <th width="10%">
          <a href="#" ng-click="sortType = 'src_number'; sortReverse = !sortReverse">
            А номер
            <span ng-show="sortType == 'src_number' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'src_number' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <th width="10%">
          <a href="#" ng-click="sortType = 'dst_number'; sortReverse = !sortReverse">
            B номер
            <span ng-show="sortType == 'dst_number' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'dst_number' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <th width="10%">
          <a href="#" ng-click="sortType = 'passed'; sortReverse = !sortReverse">
            Результат
            <span ng-show="sortType == 'passed' && sortReverse" class="caret-down"></span>
            <span ng-show="sortType == 'passed' && !sortReverse" class="caret-up"></span>
          </a>
        </th>
        <th width="1%" ng-if="userPermissions['sms_test_auth_create']">&nbsp;</th>
        <th width="1%" ng-if="userPermissions['sms_test_auth_delete']">&nbsp;</th>
      </tr>
    </thead>
    <tbody>
      <tr ng-repeat="item in list | orderBy:sortType:sortReverse | basicFilter:searchQuery:filterFields">
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>
          <img ng-if="item.is_autotest" ng-src="../img/{{ getTestResultIcon(item.passed) }}" alt="Результат теста">
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
        <td>
          <button type="button" class="btn btn-default btn-sm" ng-click="showTestPrimary(item)">MAIN</button>
      </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.trunk_name_out}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.testgroup_name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.src_number}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.dst_number}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
          <span class="label label-success" ng-if="item.passed === true">Успешно</span>
          <span class="label label-danger" ng-if="item.passed === false">Неуспешно</span>
          <span class="label label-default" ng-if="item.passed === null">Нет результата</span>
        </td>
        <td ng-if="userPermissions['sms_test_auth_create']">
          <button type="button" class="btn btn-default btn-sm" ng-click="cloneTest(item)">Клонировать</button>
        </td>
        <td ng-if="userPermissions['sms_test_auth_delete']">
          <button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button>
        </td>
      </tr>
    </tbody>
  </table>
