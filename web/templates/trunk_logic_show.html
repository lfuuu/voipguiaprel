<form class="form-horizontal" name="form">
    <div class="modal-header">
        <h3>Логические транки</h3>
    </div>
    <div class="modal-body">
        <table class="table">
            <thead>
                <tr>
                    <th>Logic Trunks</th>
                    <th>Contract Type</th> <!-- Новый столбец -->
                    <th>Trunk ID</th>
                    <th>Client ID</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="row in list">
                    <td>
                        {{row.contract_type_name || 'Не указано'}}
                    </td>
                    <td>
                        <a target="_blank" href="{{link}}usage/trunk/edit-by?clientAccountId={{row.client_account_id}}&trunkId={{row.trunk_id}}">
                            {{row.description}}
                        </a>
                    </td>
                    <td>
                        <a target="_blank" href="{{link}}usage/trunk/edit-by?clientAccountId={{row.client_account_id}}&trunkId={{row.trunk_id}}">
                            {{row.trunk_id}}
                        </a>
                    </td>
                    <td>
                        <a target="_blank" href="{{link}}usage/trunk/edit-by?clientAccountId={{row.client_account_id}}&trunkId={{row.trunk_id}}">
                            {{row.client_account_id}}
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal-footer">
        <div class="pull-left">
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>
</form>
