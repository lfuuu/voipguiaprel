<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3>Общие настройки</h3>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label class="col-sm-4 control-label">Hostname</label>
            <div class="col-sm-8">
                <input class="form-control" ng-model="item.hostname">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-4 control-label">Действие:<br/>Не достаточно денег для совершения вызова</label>
            <div class="col-sm-8">
                <select-box list="outcome" model="item.low_balance_outcome_id" default="Выберите Outcome"></select-box>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-4 control-label">Действие:<br/>Телефония заблокирована</label>
            <div class="col-sm-8">
                <select-box list="outcome" model="item.blocked_outcome_id" default="Выберите Outcome"></select-box>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-4 control-label">Подмена А номера<br/>для линии без номера</label>
            <div class="col-sm-8">
                <input class="form-control" ng-model="item.calling_station_id_for_line_without_number">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-4 control-label">Мин. цена для авто маршрутизации</label>
            <div class="col-sm-8">
                <input class="form-control" ng-model="item.min_price_for_autorouting">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-4 control-label">Сервисные номера</label>
            <div class="col-sm-8">
                <input class="form-control" ng-model="item.service_numbers">
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
