<div class="input-group input-group-sm">
    <select ui-select2 data-placeholder="{{placeholder}}" ng-model="model" ng-required="{{required}}" style="width: 100%">
        <option ng-if="placeholder || default" value="">{{default ? '-- ' + default + ' --' : ''}}</option>
        <option value="new">-- Создать --</option>
        <option ng-repeat="item in list" value="{{item.id}}">{{item.name}}</option>
    </select>
    <span class="input-group-btn">
        <button class="btn btn-default" type="button" ng-click="open(model)">
            <i class="glyphicon glyphicon-search"></i>
        </button>
    </span>
</div>
