<div class="input-group input-group-sm">
    <select ui-select2 data-placeholder="{{placeholder}}" ng-model="model" ng-disabled="{{disabled}}" ng-required="{{required}}" style="width: 99%">
        <option ng-if="placeholder || default" value="">{{default ? '-- ' + default + ' --' : ''}}</option>
        <option value="new">-- Создать --</option>
        <option ng-repeat="item in list" value="{{item.id}}">{{item.name}}</option>
    </select>
    <span style="height: 20px;display: table-cell;width: 1%;">
        <button class="btn btn-default glyphicon glyphicon-search" ng-disabled="{{disabled}}" type="button" ng-click="open(model)">
        </button>
    </span>
</div>
