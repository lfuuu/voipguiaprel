<div ng-if="userPermissions['imsi_partner_create']">
    <a class="btn btn-primary btn-sm pull-right" ng-click="clickCreate()">Создать</a>
</div>
<h4>IMSI партнеры</h4>

<form>
    <div class="form-group">
        <div class="input-group">
            <div class="input-group-addon"><i class="fa-search"></i></div>
            <input type="text" class="form-control" placeholder="Поиск" ng-model="searchQuery">
        </div>
    </div>
</form>

<table class="table table-striped table-hover table-condensed">
    <thead>
    <tr>
        <th width="5%">
            <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                ID
                <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th>
            <a href="#" ng-click="sortType = 'name'; sortReverse = !sortReverse">
                Название
                <span ng-show="sortType == 'name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th>
            <a href="#" ng-click="sortType = 'orig_trunk_name'; sortReverse = !sortReverse">
                Транк оригинации
                <span ng-show="sortType == 'orig_trunk_name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'orig_trunk_name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th>
            <a href="#" ng-click="sortType = 'term_trunk_name'; sortReverse = !sortReverse">
                Транк терминации
                <span ng-show="sortType == 'term_trunk_name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'term_trunk_name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th>
            <a href="#" ng-click="sortType = 'mvno_region_id'; sortReverse = !sortReverse">
                Регион подключения партнера
                <span ng-show="sortType == 'mvno_region_id' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'mvno_region_id' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th>
            <a href="#" ng-click="sortType = 'location_name'; sortReverse = !sortReverse">
                Местоположение транка
                <span ng-show="sortType == 'location_name' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'location_name' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th>
            <a href="#" ng-click="sortType = 'is_active'; sortReverse = !sortReverse">
                Активен
                <span ng-show="sortType == 'is_active' && sortReverse" class="caret-down"></span>
                <span ng-show="sortType == 'is_active' && !sortReverse" class="caret-up"></span>
            </a>
        </th>
        <th ng-if="userPermissions['imsi_partner_delete']" width="1%">&nbsp;</th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list | orderBy:sortType:sortReverse | basicFilter:searchQuery:filterFields">
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.id}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.orig_trunk_name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.term_trunk_name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.mvno_region_name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.location_name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <span class="label label-success" ng-if="item.is_active">Да</span>
            <span class="label label-danger" ng-if="!item.is_active">Нет</span>
        </td>
        <td>
            <comment-icon ng-if="item.id" key="{{item.id}}" type="imsi_partner" comment="item.object_comment"></comment-icon>
        </td>
        <td ng-if="userPermissions['imsi_partner_delete']"><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button></td>
    </tr>

    </tbody>
</table>
