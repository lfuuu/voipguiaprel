<form class="form-horizontal" name="form" ng-if="item">
    <div class="modal-header">
        <h3 ng-if="item.id">MNC {{item.name}}</h3>
        <h3 ng-if="!item.id">Создание MNC</h3>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label class="col-sm-2 control-label">MNC</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="MNC" ng-model="item.mnc" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">Сеть</label>
            <div class="col-sm-10">
                <input class="form-control" placeholder="Сеть" ng-model="item.network" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label">MCC</label>
            <div class="col-sm-10">
                <select-box list="mcc" model="item.mcc" default="Выберите MCC">
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <div class="pull-left">
            <button type="submit" class="btn btn-success" ng-disabled="form.$invalid" ng-click="save()">Сохранить</button>
            <button type="button" class="btn btn-default btn-sm" ng-click="back()">Закрыть</button>
        </div>
    </div>

</form>
