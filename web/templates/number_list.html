<div>
    <a class="btn btn-primary btn-sm pull-right" ng-click="clickCreate()">Создать</a>
    <h4>A/B номера</h4>
</div>

<table class="table table-striped table-hover table-condensed" >
    <thead>
    <tr>
        <th width="1%">Тип</th>
        <th>Название</th>
        <th>&nbsp;</th>
        <th width="1%">Сервер</th>
        <th width="1%">&nbsp;</th>
    </tr>
    </thead>
    <tbody>

    <tr ng-repeat="item in list">
        <td style="cursor: pointer" ng-click="clickItem(item)" nowrap>
            <span class="label label-default" ng-if="item.type_id == 1">A - номер</span>
            <span class="label label-default" ng-if="item.type_id == 2">B - номер</span>
            <span class="label label-success" ng-if="item.show_in_stat">СТАТ</span>
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.name}}</td>
        <td style="cursor: pointer" ng-click="clickItem(item)">
            <span class="label label-warning" ng-if="item.sw_shared">ОБЩИЙ</span>
        </td>
        <td style="cursor: pointer" ng-click="clickItem(item)">{{item.server_id}}</td>
        <td><button type="button" class="btn btn-danger btn-sm glyphicon glyphicon-minus" ng-click="deleteItem(item)"></button></td>
    </tr>

    </tbody>
</table>
