services:
  postgres:
    image: postgres:12
    container_name: voip_gui_postgres
    environment:
      POSTGRES_DB: nispd_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwe123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - voip_gui_network

volumes:
  postgres_data:

networks:
  voip_gui_network:
    driver: bridge

