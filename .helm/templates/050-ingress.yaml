apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-frontend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: 6000
    nginx.ingress.kubernetes.io/proxy-send-timeout: 18000
    nginx.ingress.kubernetes.io/proxy-read-timeout: 18000
    nginx.ingress.kubernetes.io/proxy-body-size: 4096m
spec:
{{- if (eq .Values.global.env "prod") }}
  tls:
    - hosts:
        - {{ .Values.ci_url | quote }}
      secretName: mcn-tls-secret
{{- end }}
  rules:
  - host: {{ .Values.ci_url | quote }}
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
{{- if (eq .Values.global.env "dev") }}
            name: {{ .Chart.Name }}-backend-dev
{{- else }}
            name: {{ .Chart.Name }}-backend-prod
{{- end }}
            port: 
              number: 80