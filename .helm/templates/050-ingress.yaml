apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-frontend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: 6000
    nginx.ingress.kubernetes.io/proxy-send-timeout: 18000
    nginx.ingress.kubernetes.io/proxy-read-timeout: 18000
    nginx.ingress.kubernetes.io/proxy-body-size: 4096m
spec:
{{- if (eq .Values.global.env "prod") }}
  tls:
    - hosts:
        - {{ .Values.ci_url | quote }}
      secretName: mcn-tls-secret
{{- end }}
  rules:
  - host: {{ .Values.ci_url | quote }}
    http:
      paths:
      - path: /
        backend:
{{- if (eq .Values.global.env "dev") }}
          serviceName: {{ .Chart.Name }}-backend-dev
{{- else }}
          serviceName: {{ .Chart.Name }}-backend-prod
{{- end }}
          servicePort: 80
      - path: /importer.php
        backend:
{{- if (eq .Values.global.env "dev") }}
          serviceName: {{ .Chart.Name }}-importer-dev
{{- else }}
          serviceName: {{ .Chart.Name }}-importer-prod
{{- end }}
          servicePort: 80
      - path: /exporter.php
        backend:
{{- if (eq .Values.global.env "dev") }}
          serviceName: {{ .Chart.Name }}-exporter-dev
{{- else }}
          serviceName: {{ .Chart.Name }}-exporter-prod
{{- end }}
          servicePort: 80
      - path: /resetter.php
        backend:
{{- if (eq .Values.global.env "dev") }}
          serviceName: {{ .Chart.Name }}-resetter-dev
{{- else }}
          serviceName: {{ .Chart.Name }}-resetter-prod
{{- end }}
          servicePort: 80
