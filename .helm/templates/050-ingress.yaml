apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-frontend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: 6000
    nginx.ingress.kubernetes.io/proxy-send-timeout: 18000
    nginx.ingress.kubernetes.io/proxy-read-timeout: 18000
    nginx.ingress.kubernetes.io/proxy-body-size: 4096m
spec:
  rules:
  - host: {{ .Values.ci_url | quote }}
    http:
      paths:
      - path: /
        backend:
{{- if (eq .Values.global.env "dev") }}
          serviceName: {{ .Chart.Name }}-backend-dev
{{- else }}
          serviceName: {{ .Chart.Name }}-backend-prod
{{- end }}
          servicePort: 80
