{{- if not (eq .Values.global.env "dev") }}
apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-frontend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  {{- if not (eq .Values.global.env "prod") }}
  - host: voip-gui.k8s-test.mcn.loc
  {{- else }}
  - host: {{ .Chart.Name }}-{{ .Values.global.env }}.local
  {{- end }}
    http:
      paths:
      - path: /
        backend:
          serviceName: {{ .Chart.Name }}-backend-prod
          servicePort: 80
{{- else }}

{{- end }}

