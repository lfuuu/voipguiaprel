apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-frontend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: {{ .Chart.Name }}.local
    http:
      paths:
      - path: /
        backend:
          serviceName: {{ .Chart.Name }}-backend
          servicePort: 80
