{{- if (eq .Values.global.env "dev") }}
{{- else }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-importer-prod
spec:
  replicas: 1
  selector:
      matchLabels:
        app: {{ .Chart.Name }}-importer-prod
  strategy: 
       type: RollingUpdate
  template:
    metadata:
      labels:
        ingressInternal: "yes"
        ingressExternal: "no"
        app: {{ .Chart.Name }}-importer-prod
{{- if (eq .Values.global.env "prod") }}
      annotations:
        scheduler.alpha.kubernetes.io/affinity: >
            {
              "podAntiAffinity": {
                "requiredDuringSchedulingIgnoredDuringExecution": [{
                  "labelSelector": {
                    "matchExpressions": [{
                      "key": "app",
                      "operator": "In",
                      "values": ["{{ .Chart.Name }}-importer-prod"]
                    }]
                  },
                  "topologyKey": "kubernetes.io/hostname"
                }]
              }
            }
{{- end }}
    spec:
      containers:
      - name: nginx
{{ tuple (printf "%s-%s" .Chart.Name "nginx-prod") . | werf_container_image | indent 8 }}
        volumeMounts:
        - name: config-volume
          subPath: nginx.conf
          mountPath: /etc/nginx/nginx.conf
        - name: assets
          mountPath: /opt/voip_gui/web/assets
        - name: shared-healthdata
          mountPath: /opt/voip_gui/web/assets2
        lifecycle:
          preStop:
            exec:
              command: ["/usr/sbin/nginx", "-s", "quit"]
      - name: php-fpm
{{ tuple (printf "%s-%s" .Chart.Name "php-fpm-prod") . | werf_container_image | indent 8 }}
        volumeMounts:
        - name: config-volume
          subPath: voipgui.php.ini
          mountPath: /usr/local/etc/php/conf.d/voipgui.php.ini
        - name: config-volume
          subPath: www.conf
          mountPath: /usr/local/etc/php-fpm.d/www.conf
        - name: config-volume
          subPath: config.local.php
          mountPath: /opt/voip_gui/web/health/config.local.php
        - name: shared-healthdata
          mountPath: /opt/voip_gui/web/assets2
        - name: assets
          mountPath: /opt/voip_gui/web/assets
        - name: config-volume
          subPath: db-local.php
          mountPath: /opt/voip_gui/config/db-local.php
        env:
        - name: TEST_DIAL_URL
          value: "http://127.0.0.1:3000/"
      volumes:
      - name: config-volume
        configMap:
          name: {{ .Chart.Name }}-config-files
      - name: shared-healthdata
        emptyDir: {}
      - name: assets
        emptyDir: {}
{{- if (eq .Values.global.env "prod") }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: workertype
                operator: In
                values:
                - virtual
                - baremetal
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-importer-prod
  labels:
    app: {{ .Chart.Name }}-importer-prod
spec:
  clusterIP: None
  selector:
    app: {{ .Chart.Name }}-importer-prod
  ports:
  - name: http
    port: 80
    protocol: TCP

{{- end }}
